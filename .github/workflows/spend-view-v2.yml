name: Build Spend View v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spend-view-v2.yml'
      - 'src/radar_presupuesto/spend_view.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spend-view-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build normalized facts required by L12 view
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from radar_presupuesto.extract import download
          from radar_presupuesto.normalize import normalize_to_parquet
          from radar_presupuesto.spend_view import build_spend_view_v2

          catalog = json.load(open('docs/data/source_catalog.json', encoding='utf-8'))
          ok = {'linked', 'linked_available', 'probed_available'}
          available = [x for x in catalog.get('downloads', []) if x.get('status') in ok]
          years = [x['year'] for x in available[-3:]]
          if len(years) < 2:
              raise SystemExit('Se requieren al menos dos años disponibles para construir L12')
          by_year = {x['year']: x for x in available}
          for year in years:
              src = by_year[year]
              raw = Path('data/raw') / f'pagos-{year}.gz'
              parquet = Path('data/processed') / f'transactions_{year}.parquet'
              download(src['url'], raw)
              meta = normalize_to_parquet(raw, parquet)
              print(f'[OK] {year}: {meta["rows"]:,} hechos normalizados')

          payload = build_spend_view_v2(
              'data/processed/transactions_*.parquet',
              output='docs/data/spend_view_v2.json',
              prioritized_path=None,
          )
          print('[OK] ventana', payload['window'])
          print('[OK] publicados', payload['published'])
          PY
      - name: Publish spend view data
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/spend_view_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publica spend view L12 real"
          git pull --rebase origin main
          git push origin main
