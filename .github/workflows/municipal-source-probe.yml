name: Probe official municipal source

on:
  workflow_dispatch:
  push:
    branches: ['feat/municipal-official-data']
    paths:
      - 'scripts/probe_municipal_source.py'
      - '.github/workflows/municipal-source-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/municipal-official-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover official municipal API surface
        run: python scripts/probe_municipal_source.py
      - name: Persist probe result
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/municipal_source_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: registra superficie oficial de gasto municipal"
          git pull --rebase origin feat/municipal-official-data
          git push origin feat/municipal-official-data
