name: Publish Public Funds Universe to ATLAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-public-funds-publish.yml'
      - 'src/radar_presupuesto/public_funds_export.py'
      - 'src/radar_presupuesto/spend_view_fast3.py'
  workflow_run:
    workflows: ['Corrected Spend Data v3']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-public-funds-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Download governed official bulks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from radar_presupuesto.extract import download

          catalogue=json.load(open('docs/data/source_catalog.json',encoding='utf-8'))
          ok={'linked','linked_available','probed_available'}
          rows=[x for x in catalogue.get('downloads',[]) if x.get('status') in ok][-3:]
          if len(rows)<2:
              raise SystemExit('No hay al menos dos años oficiales disponibles')
          Path('data/raw').mkdir(parents=True,exist_ok=True)
          paths=[]
          for row in rows:
              p=Path('data/raw')/f"pagos-{row['year']}.gz"
              meta=download(row['url'],p)
              paths.append(str(p))
              print('[OK]',row['year'],meta['bytes'],meta['sha256'])
          Path('/tmp/public-funds-paths.json').write_text(json.dumps(paths),encoding='utf-8')
          PY

      - name: Build universal RUT payment facts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from radar_presupuesto.spend_view_fast3 import materialize_light_facts_v3
          paths=json.load(open('/tmp/public-funds-paths.json',encoding='utf-8'))
          meta=materialize_light_facts_v3(paths,'data/processed/public_funds_light.parquet')
          print(json.dumps(meta,ensure_ascii=False))
          if meta.get('recipient_ruts',0) <= 0:
              raise SystemExit('No se obtuvieron RUT de receptores')
          PY

      - name: Build compact ATLAS public funds contract
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="PF-$(date -u +%Y%m)-${GITHUB_SHA:0:12}"
          echo "$SNAPSHOT" > /tmp/public-funds-snapshot.txt
          PYTHONPATH=src python -m radar_presupuesto.public_funds_export \
            --parquet data/processed/public_funds_light.parquet \
            --output /tmp/atlas-public-funds.json \
            --snapshot-id "$SNAPSHOT"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/atlas-public-funds.json',encoding='utf-8'))
          if p.get('schema')!='ATLAS_PUBLIC_FUNDS_V1': raise SystemExit('schema inesperado')
          s=p.get('semantics') or {}
          if s.get('amount_basis')!='POSITIVE_MONTO_PAGO': raise SystemExit('base de monto incorrecta')
          if s.get('identity_basis')!='RUT_EXACT_NORMALIZED': raise SystemExit('identidad no exacta')
          if s.get('intra_state')!='EXCLUDED': raise SystemExit('intraestado no excluido')
          if not p.get('entity') or not p.get('year') or not p.get('payer_year'): raise SystemExit('agregados vacíos')
          print('[OK] public funds contract',p['coverage'],len(p['entity']),len(p['year']),len(p['payer_year']))
          PY

      - name: Obtain GitHub OIDC token for ATLAS public funds
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-public-funds-ingest"
          TOKEN_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL")
          OIDC=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")
          test -n "$OIDC"
          echo "token=$OIDC" >> "$GITHUB_OUTPUT"

      - name: Publish atomically to ATLAS
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          ENDPOINT='https://ldmtlwzqaqmegedktlxr.supabase.co/functions/v1/atlas-public-funds-ingest'
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('/tmp/atlas-public-funds.json',encoding='utf-8'))
          snapshot=p['snapshot_id']
          init={
            'operation':'init','snapshot_id':snapshot,
            'expected_entity':len(p['entity']),
            'expected_year':len(p['year']),
            'expected_payer_year':len(p['payer_year']),
          }
          Path('/tmp/pf-init.json').write_text(json.dumps(init,separators=(',',':')),encoding='utf-8')
          out=Path('/tmp/pf-batches'); out.mkdir(exist_ok=True)
          seq=0
          for kind in ('entity','year','payer_year'):
              rows=p[kind]
              for start in range(0,len(rows),400):
                  seq+=1
                  body={'operation':'batch','snapshot_id':snapshot,'kind':kind,'rows':rows[start:start+400]}
                  (out/f'{seq:05d}-{kind}.json').write_text(json.dumps(body,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')
          Path('/tmp/pf-finalize.json').write_text(json.dumps({'operation':'finalize','snapshot_id':snapshot},separators=(',',':')),encoding='utf-8')
          print('[OK] batches',seq)
          PY

          post() {
            local file="$1" label="$2"
            local code
            code=$(curl --silent --show-error --output /tmp/pf-response.json --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' \
              --data-binary "@$file" "$ENDPOINT")
            if [ "$code" != "200" ]; then
              echo "[$label] HTTP $code"; cat /tmp/pf-response.json; exit 1
            fi
            python - <<'PY'
          import json
          r=json.load(open('/tmp/pf-response.json',encoding='utf-8'))
          if r.get('ok') is not True: raise SystemExit(r)
          PY
          }

          post /tmp/pf-init.json init
          for file in /tmp/pf-batches/*.json; do post "$file" "$(basename "$file")"; done
          post /tmp/pf-finalize.json finalize
          cat /tmp/pf-response.json
          echo 'ATLAS public funds publication READY'
