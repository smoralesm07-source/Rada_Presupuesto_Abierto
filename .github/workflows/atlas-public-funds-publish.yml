name: Publish Public Funds Universe to ATLAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-public-funds-publish.yml'
      - 'src/radar_presupuesto/public_funds_export.py'
      - 'src/radar_presupuesto/spend_view_fast3.py'
  workflow_run:
    workflows: ['Corrected Spend Data v3']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-public-funds-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Download full governed official history
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from radar_presupuesto.extract import download

          catalogue=json.load(open('docs/data/source_catalog.json',encoding='utf-8'))
          ok={'linked','linked_available','probed_available'}
          current_year=datetime.now(timezone.utc).year
          by_year={
              int(x['year']): x
              for x in catalogue.get('downloads',[])
              if x.get('status') in ok and 2016 <= int(x.get('year',0)) <= current_year
          }
          years=sorted(by_year)
          if not years:
              raise SystemExit('No hay años oficiales disponibles')
          expected=list(range(2016,max(years)+1))
          missing=[y for y in expected if y not in by_year]
          if missing:
              raise SystemExit(f'Historia oficial incompleta; faltan años: {missing}')

          Path('data/raw').mkdir(parents=True,exist_ok=True)
          items=[]
          for year in expected:
              row=by_year[year]
              p=Path('data/raw')/f"pagos-{year}.gz"
              meta=download(row['url'],p)
              items.append({'year':year,'path':str(p)})
              print('[OK]',year,meta['bytes'],meta['sha256'])
          Path('/tmp/public-funds-paths.json').write_text(json.dumps(items),encoding='utf-8')
          print('[OK] full history',expected[0],expected[-1],len(expected),'years')
          PY

      - name: Build universal RUT payment facts by year
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from radar_presupuesto.spend_view_fast3 import materialize_light_facts_v3

          items=json.load(open('/tmp/public-funds-paths.json',encoding='utf-8'))
          outdir=Path('data/processed/public_funds_light')
          outdir.mkdir(parents=True,exist_ok=True)
          total_rows=0
          summaries=[]
          for item in items:
              year=int(item['year'])
              out=outdir/f'public_funds_light_{year}.parquet'
              meta=materialize_light_facts_v3([item['path']],str(out))
              total_rows += int(meta.get('rows',0))
              summaries.append({'year':year,**meta})
              print('[OK] facts',year,json.dumps(meta,ensure_ascii=False))
              if meta.get('recipient_ruts',0) <= 0:
                  raise SystemExit(f'No se obtuvieron RUT de receptores para {year}')
          Path('/tmp/public-funds-facts-summary.json').write_text(json.dumps(summaries,ensure_ascii=False),encoding='utf-8')
          print('[OK] historical facts',len(summaries),'years',total_rows,'rows')
          PY

      - name: Build compact ATLAS public funds contract
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="PF-$(date -u +%Y%m)-${GITHUB_SHA:0:12}"
          echo "$SNAPSHOT" > /tmp/public-funds-snapshot.txt
          PYTHONPATH=src python -m radar_presupuesto.public_funds_export \
            --parquet data/processed/public_funds_light \
            --output /tmp/atlas-public-funds.json \
            --snapshot-id "$SNAPSHOT"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/atlas-public-funds.json',encoding='utf-8'))
          if p.get('schema')!='ATLAS_PUBLIC_FUNDS_V1': raise SystemExit('schema inesperado')
          s=p.get('semantics') or {}
          if s.get('amount_basis')!='POSITIVE_MONTO_PAGO': raise SystemExit('base de monto incorrecta')
          if s.get('identity_basis')!='RUT_EXACT_NORMALIZED': raise SystemExit('identidad no exacta')
          if s.get('intra_state')!='EXCLUDED': raise SystemExit('intraestado no excluido')
          if s.get('execution_basis')!='NET_MONTO_DEVENGADO_ALL_ROWS': raise SystemExit('base de ejecución incorrecta')
          if not p.get('entity') or not p.get('year') or not p.get('payer_year') or not p.get('execution_year'):
              raise SystemExit('agregados vacíos')
          coverage=p.get('coverage') or {}
          first=coverage.get('first_month') or ''
          if not str(first).startswith('2016-'):
              raise SystemExit(f'cobertura histórica incompleta: first_month={first}')
          latest=int(str(coverage.get('last_month') or '0')[:4] or 0)
          years={int(r['period_year']) for r in p.get('year',[]) if r.get('period_year') is not None}
          missing=[y for y in range(2016,latest+1) if y not in years]
          if missing:
              raise SystemExit(f'agregados anuales incompletos: {missing}')
          print('[OK] public funds full-history contract',p['coverage'],len(p['entity']),len(p['year']),len(p['payer_year']),len(p['execution_year']))
          PY

      - name: Publish atomically to ATLAS
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://ldmtlwzqaqmegedktlxr.supabase.co/functions/v1/atlas-public-funds-ingest'
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('/tmp/atlas-public-funds.json',encoding='utf-8'))
          snapshot=p['snapshot_id']
          init={
            'operation':'init','snapshot_id':snapshot,
            'expected_entity':len(p['entity']),
            'expected_year':len(p['year']),
            'expected_payer_year':len(p['payer_year']),
            'expected_execution_year':len(p['execution_year']),
          }
          Path('/tmp/pf-init.json').write_text(json.dumps(init,separators=(',',':')),encoding='utf-8')
          out=Path('/tmp/pf-batches'); out.mkdir(exist_ok=True)
          seq=0
          batch_size=1500
          for kind in ('entity','year','payer_year','execution_year'):
              rows=p[kind]
              for start in range(0,len(rows),batch_size):
                  seq+=1
                  body={'operation':'batch','snapshot_id':snapshot,'kind':kind,'rows':rows[start:start+batch_size]}
                  (out/f'{seq:05d}-{kind}.json').write_text(json.dumps(body,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')
          Path('/tmp/pf-finalize.json').write_text(json.dumps({'operation':'finalize','snapshot_id':snapshot},separators=(',',':')),encoding='utf-8')
          Path('/tmp/pf-status.json').write_text(json.dumps({'operation':'status','snapshot_id':snapshot},separators=(',',':')),encoding='utf-8')
          print('[OK] batches',seq,'batch_size',batch_size)
          PY

          OIDC_TOKEN=''
          OIDC_REFRESHED_AT=0

          refresh_oidc() {
            local url token_json
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-public-funds-ingest"
            token_json=$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url")
            OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")
            test -n "$OIDC_TOKEN"
            OIDC_REFRESHED_AT=$(date +%s)
          }

          ensure_oidc() {
            local now age
            now=$(date +%s)
            age=$((now - OIDC_REFRESHED_AT))
            if [ -z "$OIDC_TOKEN" ] || [ "$age" -ge 180 ]; then
              refresh_oidc
            fi
          }

          post() {
            local file="$1" label="$2" code
            ensure_oidc
            code=$(curl --silent --show-error --output /tmp/pf-response.json --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' \
              --data-binary "@$file" "$ENDPOINT")
            if [ "$code" = "401" ]; then
              refresh_oidc
              code=$(curl --silent --show-error --output /tmp/pf-response.json --write-out '%{http_code}' \
                -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' \
                --data-binary "@$file" "$ENDPOINT")
            fi
            if [ "$code" != "200" ]; then
              echo "[$label] HTTP $code"; cat /tmp/pf-response.json; exit 1
            fi
            python - <<'PY'
          import json
          r=json.load(open('/tmp/pf-response.json',encoding='utf-8'))
          if r.get('ok') is not True: raise SystemExit(r)
          PY
          }

          post /tmp/pf-init.json init
          for file in /tmp/pf-batches/*.json; do post "$file" "$(basename "$file")"; done
          post /tmp/pf-finalize.json finalize

          READY=0
          for attempt in $(seq 1 120); do
            post /tmp/pf-status.json status
            STATUS=$(python -c 'import json; print(json.load(open("/tmp/pf-response.json"))["status"])')
            echo "[status] attempt=$attempt status=$STATUS"
            if [ "$STATUS" = "READY" ]; then
              READY=1
              break
            fi
            if [ "$STATUS" != "LOADING" ]; then
              echo "Estado inesperado: $STATUS"
              cat /tmp/pf-response.json
              exit 1
            fi
            sleep 5
          done

          if [ "$READY" != "1" ]; then
            echo 'La promoción atómica no alcanzó READY dentro de 10 minutos.'
            cat /tmp/pf-response.json
            exit 1
          fi

          cat /tmp/pf-response.json
          echo 'ATLAS public funds publication READY'