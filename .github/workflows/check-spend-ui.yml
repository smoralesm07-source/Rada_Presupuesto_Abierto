name: Check RIGP Spend UI
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_v3.js'
      - 'docs/assets/spend_safe_v3.css'
      - 'docs/assets/spend_safe_network.js'
      - 'docs/assets/spend_safe_network.css'
      - 'docs/data/spend_view_v2.json'
      - 'docs/data/investigation_queue.json'
      - 'scripts/build_findings_for_pages.py'
      - 'scripts/build_explore_context_for_pages.py'
      - '.github/workflows/check-spend-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/spend_safe_v3.js
          node --check docs/assets/spend_safe_network.js
      - name: Check current HTML references
        run: |
          grep -q 'assets/spend_safe_v3.js?v=3' docs/index.html
          grep -q 'assets/spend_safe_v3.css?v=3' docs/index.html
          grep -q 'assets/spend_safe_network.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_network.css?v=1' docs/index.html
          ! grep -q 'assets/spend_v2_fast.js' docs/index.html
          ! grep -q 'assets/spend_v4_explorer.js' docs/index.html
          ! grep -q 'assets/spend_v5_focus.js' docs/index.html
          ! grep -q 'assets/spend_v6_dossier.js' docs/index.html
          ! grep -q 'assets/spend_v7_mark_filter.js' docs/index.html
      - name: Validate performance contract
        run: |
          ! grep -q 'MutationObserver' docs/assets/spend_safe_v3.js
          ! grep -q 'setInterval' docs/assets/spend_safe_v3.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_network.js
          ! grep -q 'setInterval' docs/assets/spend_safe_network.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_v3.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_network.js
          grep -q 'explore_context.json' docs/assets/spend_safe_v3.js
          grep -q 'explore_context.json' docs/assets/spend_safe_network.js
          grep -q 'MAX_NODES=12' docs/assets/spend_safe_network.js
      - name: Validate investigation UX contract
        run: |
          grep -q 'data-view="inicio"' docs/index.html
          grep -q 'data-view="bandeja"' docs/index.html
          grep -q 'data-view="hallazgos"' docs/index.html
          grep -q 'data-view="servicios"' docs/index.html
          grep -q 'data-view="proveedores"' docs/index.html
          grep -q 'data-view="explorar"' docs/index.html
          grep -q 'data-network-view' docs/index.html
          grep -q 'Foco activo' docs/assets/spend_safe_v3.js
          grep -q 'Red investigativa ligera' docs/assets/spend_safe_network.js
          grep -q 'Abrir expediente' docs/assets/spend_safe_v3.js
      - name: Parse current spend data with browser JSON parser
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/spend_view_v2.json','utf8'));
          if(d.schema!=='PRESUPUESTO_SPEND_VIEW_V2') throw new Error('unexpected schema');
          if((d.flows||[]).length>5000) throw new Error('web flow payload unexpectedly large');
          console.log('[OK] services', (d.services||[]).length, 'flows', (d.flows||[]).length);
          JS
      - name: Build compact web payloads
        run: |
          python3 scripts/build_findings_for_pages.py
          python3 scripts/build_explore_context_for_pages.py
      - name: Validate compact web payloads
        run: |
          node - <<'JS'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('docs/data/investigative_findings.json','utf8'));
          const e=JSON.parse(fs.readFileSync('docs/data/explore_context.json','utf8'));
          if(!String(f.methodology_version||'').startsWith('RIGP-FINDINGS')) throw new Error('unexpected findings methodology');
          if(!Array.isArray(f.relation_findings)||!f.guardrail) throw new Error('findings payload incomplete');
          if(f.relation_findings.length>2500) throw new Error('findings payload unexpectedly large');
          if(e.schema!=='RIGP-EXPLORE-CONTEXT-v1') throw new Error('unexpected explore schema');
          const bytes=fs.statSync('docs/data/explore_context.json').size;
          if(bytes>1024*1024) throw new Error('explore context unexpectedly large');
          console.log('[OK] findings',f.relation_findings.length,'explore bytes',bytes);
          JS
