name: Check RIGP Spend UI
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_v2_fast.js'
      - 'docs/assets/json_compat.js'
      - 'docs/assets/spend_v4_explorer.js'
      - 'docs/assets/spend_v4.css'
      - 'docs/assets/spend_v5_focus.js'
      - 'docs/assets/spend_v5.css'
      - 'docs/assets/spend_v6_dossier.js'
      - 'docs/assets/spend_v6.css'
      - 'docs/assets/spend_v7_mark_filter.js'
      - 'docs/assets/spend_v7.css'
      - 'docs/assets/spend_v8_findings.js'
      - 'docs/assets/spend_v8_findings.css'
      - 'docs/assets/spend_v9_review.js'
      - 'docs/assets/spend_v9_review.css'
      - 'docs/data/spend_view_v2.json'
      - 'docs/data/spend_years_v1.json'
      - 'docs/data/entity_enrichment_v1.json'
      - 'docs/data/investigation_queue.json'
      - 'docs/data/investigative_findings.json'
      - '.github/workflows/check-spend-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/spend_v2_fast.js
          node --check docs/assets/json_compat.js
          node --check docs/assets/spend_v4_explorer.js
          node --check docs/assets/spend_v5_focus.js
          node --check docs/assets/spend_v6_dossier.js
          node --check docs/assets/spend_v7_mark_filter.js
          node --check docs/assets/spend_v8_findings.js
          node --check docs/assets/spend_v9_review.js
      - name: Check current HTML references and information hierarchy
        run: |
          grep -q 'assets/json_compat.js' docs/index.html
          grep -q 'assets/spend_v2_fast.js' docs/index.html
          grep -q 'assets/spend_v4_explorer.js' docs/index.html
          grep -q 'assets/spend_v5_focus.js' docs/index.html
          grep -q 'assets/spend_v6_dossier.js' docs/index.html
          grep -q 'assets/spend_v7_mark_filter.js' docs/index.html
          grep -q 'assets/spend_v8_findings.js' docs/index.html
          grep -q 'assets/spend_v9_review.js' docs/index.html
          grep -q 'assets/spend_v8_findings.css' docs/index.html
          grep -q 'assets/spend_v9_review.css' docs/index.html
          grep -q 'Hallazgos prioritarios' docs/index.html
          grep -q 'Dónde mirar primero' docs/index.html
          grep -q 'Explorar y comprobar el contexto' docs/index.html
          grep -q 'Señales asociadas a proveedores' docs/index.html
          grep -q 'Referencia UAF' docs/assets/spend_v5_focus.js
          grep -q "uaf:false" docs/assets/spend_v5_focus.js
          grep -q 'Meses con pagos' docs/assets/spend_v6_dossier.js
          grep -q 'Actividades vigentes' docs/assets/spend_v6_dossier.js
          grep -q '0,01–200,00 UF/año' docs/assets/spend_v6_dossier.js
          ! grep -q 'assets/spend_v3_enhance.js' docs/index.html
      - name: Parse current spend data with browser JSON parser
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/spend_view_v2.json','utf8'));
          if(d.schema!=='PRESUPUESTO_SPEND_VIEW_V2') throw new Error('unexpected schema');
          console.log('[OK] browser JSON.parse', d.published);
          JS
      - name: Validate multiyear explorer payload
        run: |
          if [ ! -f docs/data/spend_years_v1.json ]; then
            echo '[INFO] multiyear payload pending first build'
            exit 0
          fi
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/spend_years_v1.json','utf8'));
          if(d.schema!=='PRESUPUESTO_SPEND_YEARS_V1') throw new Error('unexpected multiyear schema');
          if(!Array.isArray(d.years)||d.years.length<2) throw new Error('insufficient year coverage');
          if(!Array.isArray(d.reference_entities)||!d.reference_entities.some(x=>x.role==='UAF_REFERENCE')) throw new Error('UAF reference metadata missing');
          if(!Array.isArray(d.marks)) throw new Error('marks catalogue missing');
          const pm=(d.providers||[]).filter(x=>Array.isArray(x.monthly)&&x.monthly.length).length;
          console.log('[OK] years',d.years,'marks',d.marks.length,'providers with payment months',pm);
          JS
      - name: Validate selective SII enrichment
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/entity_enrichment_v1.json','utf8'));
          if(d.schema!=='PRESUPUESTO_ENTITY_ENRICHMENT_V1') throw new Error('unexpected SII enrichment schema');
          const es=Object.values(d.entities||{});
          if(!es.length) throw new Error('empty SII enrichment');
          if(!es.some(x=>x.start_date||x.sales_band_label||x.workers!=null||(x.acteco||[]).length)) throw new Error('SII dossier fields are empty');
          if(!es.some(x=>(x.marks||[]).length)) throw new Error('SII marks missing');
          console.log('[OK] SII entities',es.length,'with marks',es.filter(x=>(x.marks||[]).length).length);
          JS
      - name: Validate findings payload or browser fallback
        run: |
          node - <<'JS'
          const fs=require('fs');
          if(fs.existsSync('docs/data/investigative_findings.json')){
            const d=JSON.parse(fs.readFileSync('docs/data/investigative_findings.json','utf8'));
            if(!String(d.methodology_version||'').startsWith('RIGP-FINDINGS')) throw new Error('unexpected findings methodology');
            if(!Array.isArray(d.relation_findings)) throw new Error('relation_findings missing');
            if(!d.guardrail) throw new Error('findings guardrail missing');
            console.log('[OK] RIGP findings',d.relation_findings.length);
          }else{
            const q=JSON.parse(fs.readFileSync('docs/data/investigation_queue.json','utf8'));
            if(!Array.isArray(q.queue)) throw new Error('investigation queue missing');
            const js=fs.readFileSync('docs/assets/spend_v8_findings.js','utf8');
            if(!js.includes('fallback(q.queue')) throw new Error('findings fallback not wired');
            console.log('[OK] browser fallback from queue',q.queue.length);
          }
          JS
      - name: Test legacy NaN browser fallback
        run: |
          node - <<'JS'
          const fs=require('fs');
          eval(fs.readFileSync('docs/assets/json_compat.js','utf8'));
          new Response('{"amount_l12":NaN,"q4":Infinity,"down":-Infinity,"provider":"NaN Servicios"}').json().then(d=>{
            if(d.amount_l12!==null||d.q4!==null||d.down!==null||d.provider!=='NaN Servicios') throw new Error('compat sanitizer failed');
            console.log('[OK] legacy non-finite fallback');
          });
          JS
      - name: Validate private supplier scope
        run: |
          python - <<'PY'
          import json,re,unicodedata
          d=json.load(open('docs/data/spend_view_v2.json',encoding='utf-8'))
          def norm(v):
              x=unicodedata.normalize('NFKD',str(v or '')).encode('ascii','ignore').decode().upper()
              return re.sub(r'\s+',' ',re.sub(r'[^A-Z0-9]+',' ',x)).strip()
          public=('TESORERIA GENERAL DE LA REPUBLICA','SERVICIO DE IMPUESTOS INTERNOS','MINISTERIO DE','MUNICIPALIDAD DE','ILUSTRE MUNICIPALIDAD','GOBIERNO REGIONAL','SERVICIO DE SALUD')
          bad=[f for f in d.get('flows',[]) if any(p in norm(f.get('provider_name')) for p in public)]
          if bad:
              raise SystemExit(f'public suppliers remain: {[(x.get("provider_name"),x.get("rut")) for x in bad[:10]]}')
          print('[OK] supplier scope excludes public institutions')
          PY
