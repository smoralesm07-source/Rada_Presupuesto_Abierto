name: Check Spend View UI
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_v2_fast.js'
      - 'docs/assets/json_compat.js'
      - 'docs/data/spend_view_v2.json'
      - '.github/workflows/check-spend-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        id: js
        continue-on-error: true
        run: |
          node --check docs/assets/spend_v2_fast.js
          node --check docs/assets/json_compat.js
      - name: Check HTML references
        id: html
        continue-on-error: true
        run: |
          grep -q 'assets/json_compat.js' docs/index.html
          grep -q 'assets/spend_v2_fast.js' docs/index.html
          grep -q 'data/spend_view_v2.json' docs/assets/spend_v2_fast.js
      - name: Parse current data with browser JSON parser
        id: browser_json
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs=require('fs');
          const txt=fs.readFileSync('docs/data/spend_view_v2.json','utf8');
          const d=JSON.parse(txt);
          if(d.schema!=='PRESUPUESTO_SPEND_VIEW_V2') throw new Error('unexpected schema');
          console.log('[OK] browser JSON.parse', d.published);
          JS
      - name: Test legacy NaN browser fallback
        id: compat
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs=require('fs');
          eval(fs.readFileSync('docs/assets/json_compat.js','utf8'));
          new Response('{"amount_l12":NaN,"q4":Infinity,"down":-Infinity,"provider":"NaN Servicios"}').json().then(d=>{
            if(d.amount_l12!==null||d.q4!==null||d.down!==null||d.provider!=='NaN Servicios') throw new Error('compat sanitizer failed');
            console.log('[OK] legacy non-finite fallback');
          });
          JS
      - name: Publish UI check status
        if: always()
        env:
          JS_OUTCOME: ${{ steps.js.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          BROWSER_JSON_OUTCOME: ${{ steps.browser_json.outcome }}
          COMPAT_OUTCOME: ${{ steps.compat.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p={
            'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'javascript':os.environ.get('JS_OUTCOME'),
            'html_references':os.environ.get('HTML_OUTCOME'),
            'browser_json_parse':os.environ.get('BROWSER_JSON_OUTCOME'),
            'legacy_nan_fallback':os.environ.get('COMPAT_OUTCOME'),
          }
          Path('docs/data/spend_ui_status.json').write_text(json.dumps(p,ensure_ascii=False,indent=2,allow_nan=False),encoding='utf-8')
          PY
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/spend_ui_status.json
          git commit -m "ci: publica estado UI spend view" || exit 0
          git pull --rebase origin main
          git push origin main
      - name: Fail if validation failed
        if: steps.js.outcome != 'success' || steps.html.outcome != 'success' || steps.browser_json.outcome != 'success' || steps.compat.outcome != 'success'
        run: exit 1
