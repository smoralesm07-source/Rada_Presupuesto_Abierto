name: Search Presupuesto Abierto
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Años: 2026 | 2024 2025 2026 | 2016-2026"
        required: true
        default: '2026'
      text:
        description: 'Texto libre (receptor, organismo, gasto, documento, OC, BIP)'
        required: false
        default: ''
      filters_json:
        description: 'Filtros JSON, ej. {"rut":"96875230-8","provider_only":true,"min_amount":1000000}'
        required: false
        default: '{}'
      limit:
        description: 'Máximo resultados global (1-10000)'
        required: true
        default: '1000'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute auditable historical search
        env:
          PYTHONPATH: src
          YEARS: ${{ inputs.years }}
          TEXT: ${{ inputs.text }}
          FILTERS: ${{ inputs.filters_json }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python -m radar_presupuesto.query_job --years "$YEARS" --text "$TEXT" --filters-json "$FILTERS" --limit "$LIMIT"
      - name: Upload query result
        uses: actions/upload-artifact@v4
        with:
          name: presupuesto-abierto-search
          retention-days: 30
          if-no-files-found: error
          path: |
            data/query/result.csv
            data/query/result.json
            data/query/query_metadata.json
