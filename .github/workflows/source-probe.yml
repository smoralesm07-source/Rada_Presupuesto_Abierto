name: Source coverage probe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m radar_presupuesto.cli probe
      - name: Persist coverage metadata
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/source_catalog.json docs/data/coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: actualiza cobertura de fuentes"
          git pull --rebase origin main
          git push origin main
