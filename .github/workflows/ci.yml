name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `branches` filtra la rama BASE. Sin las ramas de trabajo, un PR apilado
    # sobre otro no corre CI hasta que el de abajo se fusiona, que es justo
    # cuando ya no sirve enterarse.
    branches: [main, 'claude/**', 'chatgpt/**']
  # Un pull request abierto por el bot con GITHUB_TOKEN si crea su corrida
  # `pull_request`, pero GitHub la deja sin ejecutar: la corrida 553 quedo con
  # cero jobs y por eso no nacio ningun check. La proteccion de rama pide `test`
  # y el PR queda bloqueado para siempre.
  #
  # `workflow_dispatch` es una de las dos excepciones a esa regla, asi que la
  # corrida si puede pedirse. Pero el check que produce NO satisface la regla:
  # medido sobre el PR #45, con `test` en verde por esta via, la fusion se
  # rechazo igual con «Required status check "test" is expected». Lo que cuenta
  # es el estado de commit que se publica al final.
  workflow_dispatch:
permissions:
  contents: read
  # Para publicar el resultado real de la suite como estado de commit `test`.
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Case-first UI syntax and architecture
        run: |
          node --check docs/assets/rigp_case_app.js
          grep -q 'data-view="bandeja"' docs/index.html
          grep -q 'data-view="triage"' docs/index.html
          grep -q 'data-view="caso"' docs/index.html
          grep -q 'data-view="entidad"' docs/index.html
          grep -q 'data-view="informe"' docs/index.html
          test "$(grep -o 'assets/rigp_case_app.js' docs/index.html | wc -l)" -eq 1
          test "$(grep -o 'assets/rigp_case_app.css' docs/index.html | wc -l)" -eq 1
          ! grep -q 'spend_safe_' docs/index.html
          ! grep -q 'spend_v[0-9]' docs/index.html
          ! grep -q 'MutationObserver' docs/assets/rigp_case_app.js
          ! grep -q 'setInterval' docs/assets/rigp_case_app.js
          ! grep -q 'investigation_queue.json' docs/assets/rigp_case_app.js
          ! grep -q 'spend_years_v1.json' docs/assets/rigp_case_app.js
      - name: Persistent case model contract
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS rigp_cases' schemas/011_cases.sql
          grep -q 'CREATE TABLE IF NOT EXISTS rigp_case_findings' schemas/011_cases.sql
          grep -q 'CREATE TABLE IF NOT EXISTS rigp_case_evidence' schemas/011_cases.sql
          grep -q 'CREATE TABLE IF NOT EXISTS rigp_case_events' schemas/011_cases.sql
          grep -q 'CANDIDATA' schemas/011_cases.sql
      - name: Unit and analytical engine tests
        run: PYTHONPATH=src pytest -q
      - name: End-to-end sample pipeline
        run: PYTHONPATH=src python -m radar_presupuesto.pipeline --sample tests/fixtures/sample_transactions.csv --cgr-dir /tmp/no-cgr
      - name: Exercise publication diversity, score separation, procurement and run summary
        run: |
          PYTHONPATH=src python - <<'PY'
          from radar_presupuesto.publication_selection import rebalance_findings_publication
          from radar_presupuesto.procurement_context import build_procurement_context
          from radar_presupuesto.signal_health import build_signal_health
          from radar_presupuesto.pattern_compatibility import best_pattern
          from radar_presupuesto.run_summary import build_run_summary
          publication = rebalance_findings_publication(max_rows=600, reserve_per_signal=20)
          procurement = build_procurement_context('data/processed/transactions_sample.parquet')
          health = build_signal_health()
          pattern = best_pattern(['PROVIDER_CONCENTRATION','NEW_TO_SERIES_HIGH_SPEND','AMOUNT_OUTLIER'])
          summary = build_run_summary(output_json='/tmp/radar_run_summary.json')
          assert summary['schema'] == 'RIGP-RUN-SUMMARY-v1'
          assert 0 <= summary['context']['peer_context_coverage'] <= 1
          assert 0 <= summary['procurement']['purchase_order_coverage'] <= 1
          assert 'statuses' in summary['signals']
          assert 'warnings' in summary
          print(publication)
          print(procurement)
          print('signal health needs review:', health['needs_review_signal_types'])
          print('pattern compatibility:', pattern)
          print('run summary:', summary)
          PY
      - name: Validate sample products
        run: |
          python - <<'PY'
          import json
          q=json.load(open('docs/data/quality.json'))
          d=json.load(open('docs/data/dashboard.json'))
          iq=json.load(open('docs/data/investigation_queue.json'))
          fh=json.load(open('docs/data/investigative_findings.json'))
          pc=json.load(open('docs/data/procurement_context.json'))
          sh=json.load(open('docs/data/signal_health.json'))
          assert q['transaction_id_collision_ratio'] == 0
          assert q['distinct_transaction_ids'] == q['rows']
          assert iq['total_signals'] == d['metrics']['signals']
          assert fh['methodology_version'].startswith('RIGP-FINDINGS')
          assert 'relation_findings' in fh and 'service_hotspots' in fh and 'provider_hotspots' in fh
          assert 'guardrail' in fh
          assert fh.get('publication_selection',{}).get('method') == 'priority_with_signal_diversity_reserve'
          assert fh.get('score_separation',{}).get('review_priority')
          assert fh.get('score_separation',{}).get('pattern_compatibility')
          assert len(fh['relation_findings']) <= 600
          for row in fh['relation_findings']:
              assert 'pattern_compatibility' in row
          # Este payload lo acaba de reescribir el paso anterior sobre la muestra, así
          # que la versión que se exige aquí es la que emite el motor de este commit.
          assert pc['schema'] == 'RIGP-PROCUREMENT-CONTEXT-v2'
          assert 'coverage' in pc and 'findings' in pc and 'guardrail' in pc
          assert 'split_guardrail' in pc
          assert 'findings_worth_triage' in pc['coverage']
          for row in pc['findings']:
              assert 'split_shape' in row and 'weekly_clusters' in row
          assert sh['schema'] == 'RIGP-SIGNAL-HEALTH-v1'
          assert len(sh['signals']) == sh['expected_signal_types']
          assert {x['layer'] for x in sh['signals']} == {'TRANSACCION','ENTIDAD'}
          assert all(x['status'] in {'ACTIVE','LOW_VOLUME','EXPERIMENTAL_ZERO','DOMINANT_REVIEW'} for x in sh['signals'])
          print('Priority tiers:', iq['priority_tiers'])
          print('Finding relations:', len(fh['relation_findings']))
          print('Publication selection:', fh['publication_selection'])
          print('Procurement coverage:', pc['coverage'])
          print('Signal health:', [(x['signal_type'],x['layer'],x['status'],x['signal_count']) for x in sh['signals']])
          print('Capas activas:', sh['active_layers'])
          PY
      - name: Historical window contract
        run: |
          PYTHONPATH=src python - <<'PY'
          from radar_presupuesto.analysis_window import resolve_analysis_years, describe_window
          years=resolve_analysis_years('docs/data/source_catalog.json')
          meta=describe_window(years)
          assert meta['year_count'] >= 5
          assert years[-1] == max(years)
          print('default analysis window:', meta)
          PY
      - name: Official source smoke test
        run: |
          PYTHONPATH=src python -m radar_presupuesto.cli probe --catalog /tmp/source_catalog.json --coverage /tmp/coverage.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/source_catalog.json'))
          ok=[x for x in d.get('downloads',[]) if x.get('status') in ('linked','linked_available','probed_available')]
          assert ok, 'No official Presupuesto Abierto bulk source could be confirmed'
          print('Bulk years confirmed:', [x['year'] for x in ok])
          print('Latest confirmed year:', max(x['year'] for x in ok))
          PY

      - name: Publicar el resultado como estado de commit
        # Sólo en corridas solicitadas a mano: en un `pull_request` normal el
        # check nativo ya existe y este estado sería una segunda copia.
        #
        # No es un atajo: la suite completa acaba de correr en este mismo job y
        # lo que se publica es su conclusión real, con enlace a la corrida. Es la
        # única forma de que un pull request abierto por el bot llegue a tener el
        # check que la protección de rama exige.
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ESTADO: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${ESTADO}" \
            -f context=test \
            -f description="Suite ejecutada por solicitud sobre esta rama" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
