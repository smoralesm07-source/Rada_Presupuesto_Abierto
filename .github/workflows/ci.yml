name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt

      - name: Application JavaScript syntax
        run: |
          for f in docs/app/*.mjs docs/app/views/*.mjs; do node --check "$f"; done

      - name: Unit + operational engine tests
        run: PYTHONPATH=src pytest -q

      - name: End-to-end sample pipeline
        run: PYTHONPATH=src python -m radar_presupuesto.pipeline --sample tests/fixtures/sample_transactions.csv --cgr-dir /tmp/no-cgr

      - name: Build published payloads
        run: |
          python scripts/build_explore_context_for_pages.py
          python scripts/publish_static_payloads.py
          python scripts/build_triage_for_pages.py

      - name: Validate integrity, both axes and declared coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          quality = json.loads(Path('docs/data/quality.json').read_text())
          queue = json.loads(Path('docs/data/investigation_queue.json').read_text())
          findings = json.loads(Path('docs/data/investigative_findings.json').read_text())
          triage = json.loads(Path('docs/data/triage.json').read_text())
          typology = json.loads(Path('docs/data/typology_context.json').read_text())
          procurement = json.loads(Path('docs/data/procurement_status.json').read_text())

          # Identidad: una repetición documental nunca puede colisionar en la clave física.
          assert quality['transaction_id_collision_ratio'] == 0
          assert quality['distinct_transaction_ids'] == quality['rows']

          # La cola v2 publica su política, no un corte silencioso.
          assert queue['schema'] == 'RIGP-INVESTIGATION-QUEUE-v2'
          assert queue['publication_policy']['top_n'] >= 5000, 'el corte de publicación no puede volver a 250'
          assert queue['publication_policy']['family_min_share'] > 0, 'sin cuota, una familia entera desaparece del corte'
          assert queue['peer_groups'] >= 1, 'el score exige un grupo de pares explícito'
          for row in queue['queue']:
              assert 'review_priority_score' in row
              assert 'rarity_component' in row
              assert 'relative_materiality_component' in row

          # Hallazgos y triage llevan los dos ejes por separado.
          assert findings['methodology_version'].startswith('RIGP-FINDINGS')
          assert 'laft_compatibility_score' in findings['axes']
          assert triage['schema'] == 'RIGP-TRIAGE-v1'
          assert set(triage['axes']) == {'review_priority_score', 'laft_compatibility_score'}

          # Cada tipología dice qué la descartaría y qué documento pedir.
          for entry in typology['catalog']:
              assert entry['sustains'] and entry['discards'] and entry['documents'], entry['code']

          # Las capas no integradas se declaran en vez de desaparecer.
          assert procurement['integration_state'] in {'SNAPSHOT_PRESENT', 'ADAPTER_READY_SOURCE_PENDING'}
          assert procurement['join_key'] == 'orden_compra'
          assert isinstance(triage['coverage']['pending_layers'], list)

          print('cola:', queue['priority_tiers'], '| publicadas:', queue['published_signals'])
          print('familias publicadas:', queue['published_families'])
          print('triage:', triage['coverage']['relations_published'], 'relaciones')
          print('capas pendientes:', triage['coverage']['pending_layers'])
          PY

      - name: Official source smoke test
        run: |
          PYTHONPATH=src python -m radar_presupuesto.cli probe --catalog /tmp/source_catalog.json --coverage /tmp/coverage.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/source_catalog.json'))
          ok=[x for x in d.get('downloads',[]) if x.get('status') in ('linked','linked_available','probed_available')]
          assert ok, 'No official Presupuesto Abierto bulk source could be confirmed'
          print('Bulk years confirmed:', [x['year'] for x in ok])
          print('Latest confirmed year:', max(x['year'] for x in ok))
          PY
