name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: UI JavaScript syntax
        run: |
          node --check docs/assets/spend_safe_v3.js
          node --check docs/assets/spend_safe_network.js
          node --check docs/assets/spend_v14_boot.js
          node --check docs/assets/spend_v14_explore.js
          node --check docs/assets/spend_v14_focus.js
          node --check docs/assets/spend_v15_shell.js
          node --check docs/assets/spend_v8_findings.js
          node --check docs/assets/spend_v9_review.js
          node --check docs/assets/spend_v10_learning.js
          node --check docs/assets/spend_v11_evidence.js
          node --check docs/assets/spend_v12_workqueue_bridge.js
          node --check docs/assets/spend_v12_workqueue.js
      - name: UX and performance contract
        run: |
          grep -q 'data-network-view' docs/index.html
          grep -q 'MAX_NODES=12' docs/assets/spend_safe_network.js
          grep -q 'Red investigativa ligera' docs/assets/spend_safe_network.js
          grep -q 'carga contextual bajo demanda' docs/assets/spend_safe_v3.js
          grep -q 'explore_context.json' docs/assets/spend_safe_v3.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_v3.js
          ! grep -q 'setInterval' docs/assets/spend_safe_v3.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_network.js
          ! grep -q 'setInterval' docs/assets/spend_safe_network.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_v3.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_network.js
          ! grep -q 'assets/spend_v2_fast.js' docs/index.html
          ! grep -q 'assets/spend_v4_explorer.js' docs/index.html
          ! grep -q 'assets/spend_v5_focus.js' docs/index.html
          ! grep -q 'assets/spend_v6_dossier.js' docs/index.html
          ! grep -q 'assets/spend_v7_mark_filter.js' docs/index.html
      - name: Human review, learning, evidence and work queue contract
        run: |
          grep -q 'useful_signals' docs/assets/spend_v9_review.js
          grep -q 'low_value_signals' docs/assets/spend_v9_review.js
          grep -q 'rigp-review-updated' docs/assets/spend_v9_review.js
          grep -q '30 hallazgos' docs/RIGP_LEARNING_METHOD.md
          grep -q 'no modifican automáticamente' docs/assets/spend_v10_learning.js
          grep -q 'Expediente de evidencia' docs/assets/spend_v11_evidence.js
          grep -q 'Preguntas que deben quedar resueltas' docs/assets/spend_v11_evidence.js
          grep -q 'no determina delito' docs/assets/spend_v11_evidence.js
          grep -q 'Siguiente recomendado' docs/assets/spend_v12_workqueue.js
          grep -q 'Tomar revisión' docs/assets/spend_v12_workqueue.js
      - name: Unit + operational engine tests
        run: PYTHONPATH=src pytest -q
      - name: End-to-end sample pipeline
        run: PYTHONPATH=src python -m radar_presupuesto.pipeline --sample tests/fixtures/sample_transactions.csv --cgr-dir /tmp/no-cgr
      - name: Build compact contextual payload
        run: python scripts/build_explore_context_for_pages.py
      - name: Validate sample integrity, queue, findings and contextual payload
        run: |
          python - <<'PY'
          import json
          q=json.load(open('docs/data/quality.json'))
          d=json.load(open('docs/data/dashboard.json'))
          iq=json.load(open('docs/data/investigation_queue.json'))
          fh=json.load(open('docs/data/investigative_findings.json'))
          ex=json.load(open('docs/data/explore_context.json'))
          assert q['transaction_id_collision_ratio'] == 0
          assert q['distinct_transaction_ids'] == q['rows']
          assert iq['total_signals'] == d['metrics']['signals']
          assert fh['methodology_version'].startswith('RIGP-FINDINGS')
          assert 'relation_findings' in fh and 'service_hotspots' in fh and 'provider_hotspots' in fh
          assert 'guardrail' in fh
          assert ex['schema'] == 'RIGP-EXPLORE-CONTEXT-v1'
          assert 'services' in ex and 'providers' in ex and 'relations' in ex
          print('Priority tiers:', iq['priority_tiers'])
          print('Finding relations:', len(fh['relation_findings']))
          print('Explore coverage:', ex['coverage'])
          PY
      - name: Official source smoke test
        run: |
          PYTHONPATH=src python -m radar_presupuesto.cli probe --catalog /tmp/source_catalog.json --coverage /tmp/coverage.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/source_catalog.json'))
          ok=[x for x in d.get('downloads',[]) if x.get('status') in ('linked','linked_available','probed_available')]
          assert ok, 'No official Presupuesto Abierto bulk source could be confirmed'
          print('Bulk years confirmed:', [x['year'] for x in ok])
          print('Latest confirmed year:', max(x['year'] for x in ok))
          PY
