name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit + operational engine tests
        run: PYTHONPATH=src pytest -q
      - name: End-to-end sample pipeline
        run: PYTHONPATH=src python -m radar_presupuesto.pipeline --sample tests/fixtures/sample_transactions.csv --cgr-dir /tmp/no-cgr
      - name: Validate sample integrity and queue
        run: |
          python - <<'PY'
          import json
          q=json.load(open('docs/data/quality.json'))
          d=json.load(open('docs/data/dashboard.json'))
          iq=json.load(open('docs/data/investigation_queue.json'))
          assert q['transaction_id_collision_ratio'] == 0
          assert q['distinct_transaction_ids'] == q['rows']
          assert iq['total_signals'] == d['metrics']['signals']
          sv=json.load(open('docs/data/spend_view_v1.json'))
          assert sv['schema'] == 'PRESUPUESTO_SPEND_VIEW_V1'
          assert sv['coverage']['transactions'] == d['metrics']['transactions']
          assert sv['territory']['regions'], 'la vista territorial no puede quedar vacía'
          assert sv['headline_indicators'] and sv['guardrails']
          weights=sv['providers']['score_weights']
          assert sum(weights.values()) == 100, weights
          for p in sv['providers']['anomalous']:
              assert p['anomaly_score'] <= 100
              assert p['reasons'], 'todo proveedor listado debe traer contribuciones explicables'
          inst=sv['institutions']
          assert inst['rows'], 'el eje institucional no puede quedar vacío'
          assert inst['participation']['series'], 'falta la participación anual de los servicios'
          for org in inst['rows']:
              assert len(org['amounts_by_year']) == len(inst['years'])
              if org['detail_available']:
                  assert org['organization_id'] in inst['detail']
          print('Priority tiers:', iq['priority_tiers'])
          print('Spend view regions:', len(sv['territory']['regions']))
          print('Instituciones:', len(inst['rows']), 'con ficha:', inst['coverage']['organizations_with_detail'])
          PY
      - name: Demo spend view artifact stays reproducible
        run: |
          PYTHONPATH=src python scripts/build_demo_spend_view.py --work-dir /tmp/demo --output /tmp/spend_view_demo_v1.json
          python - <<'PY'
          import json
          demo=json.load(open('/tmp/spend_view_demo_v1.json'))
          published=json.load(open('docs/data/spend_view_demo_v1.json'))
          assert demo['mode'] == published['mode'] == 'DEMO_SYNTHETIC'
          assert demo['coverage']['transactions'] == published['coverage']['transactions'], 'la demo dejó de ser determinista'
          assert demo['coverage']['devengado_clp'] == published['coverage']['devengado_clp']
          print('Demo transactions:', demo['coverage']['transactions'])
          PY
      - name: Official source smoke test
        run: |
          PYTHONPATH=src python -m radar_presupuesto.cli probe --catalog /tmp/source_catalog.json --coverage /tmp/coverage.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/source_catalog.json'))
          ok=[x for x in d.get('downloads',[]) if x.get('status') in ('linked','linked_available','probed_available')]
          assert ok, 'No official Presupuesto Abierto bulk source could be confirmed'
          print('Bulk years confirmed:', [x['year'] for x in ok])
          print('Latest confirmed year:', max(x['year'] for x in ok))
          PY
