name: Check RIGP Actor UX
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_actor_ux.js'
      - 'docs/assets/spend_safe_actor_ux.css'
      - '.github/workflows/check-actor-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate actor UX runtime
        run: |
          node --check docs/assets/spend_safe_actor_ux.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_actor_ux.js
          ! grep -q 'setInterval' docs/assets/spend_safe_actor_ux.js
          ! grep -q 'investigation_queue.json' docs/assets/spend_safe_actor_ux.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_actor_ux.js
      - name: Validate progressive actor disclosure
        run: |
          grep -q 'assets/spend_safe_actor_ux.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_actor_ux.css?v=1' docs/index.html
          grep -q 'Lee cada actor en este orden' docs/assets/spend_safe_actor_ux.js
          grep -q 'Ver trazabilidad' docs/assets/spend_safe_actor_ux.js
          grep -q 'Buscar / filtrar actores' docs/assets/spend_safe_actor_ux.js
          grep -q 'actor-section-expanded' docs/assets/spend_safe_actor_ux.js
          grep -q 'actor-card.actor-expanded' docs/assets/spend_safe_actor_ux.css
          grep -q 'nth-child(n+9)' docs/assets/spend_safe_actor_ux.css
