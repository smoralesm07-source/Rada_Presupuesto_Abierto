name: Check RIGP Focus Summary
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_focus_summary.js'
      - 'docs/assets/spend_safe_focus_summary.css'
      - '.github/workflows/check-focus-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate focus runtime
        run: |
          node --check docs/assets/spend_safe_focus_summary.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_focus_summary.js
          ! grep -q 'setInterval' docs/assets/spend_safe_focus_summary.js
          ! grep -q 'investigation_queue.json' docs/assets/spend_safe_focus_summary.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_focus_summary.js
      - name: Validate focus contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          js=Path('docs/assets/spend_safe_focus_summary.js').read_text(encoding='utf-8')
          css=Path('docs/assets/spend_safe_focus_summary.css').read_text(encoding='utf-8')
          for x in ['spend_safe_focus_summary.css?v=1','spend_safe_focus_summary.js?v=1']:
              assert x in html, x
          for x in ['Foco actual','Qué falta acreditar para avanzar','rigp_active_finding_v1','sessionStorage','Hallazgo priorizado','Actor vinculado','Valor documentado','Nexo documentado']:
              assert x in js, x
          for x in ['.focus-summary','.fs-progress','.fs-gap']:
              assert x in css, x
          print('[OK] persistent investigation focus contract')
          PY
