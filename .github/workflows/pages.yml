name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_explore_context_for_pages.py'
      - 'scripts/build_triage_for_pages.py'
      - 'scripts/publish_static_payloads.py'
      - 'src/radar_presupuesto/typologies.py'
      - 'src/radar_presupuesto/procurement.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Bootstrap real 2026'
      - 'Radar monthly analysis'
      - 'Corrected Spend Data v3'
      - 'Enrich Spend Suppliers with SII'
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # No cancelar un deploy válido si llega, mientras publica, otro workflow_run
  # que finalmente será omitido por la condición del job.
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      # El orden importa: explore lee la cola directamente (no el triage), para
      # que ambos builders no queden circulares.
      - name: Build compact explore context
        run: python scripts/build_explore_context_for_pages.py
      - name: Publish declarative payloads (typologies, procurement adapter)
        run: python scripts/publish_static_payloads.py
      - name: Build triage payload
        run: python scripts/build_triage_for_pages.py

      - name: Validate published contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          triage = json.loads(Path('docs/data/triage.json').read_text(encoding='utf-8'))
          explore = json.loads(Path('docs/data/explore_context.json').read_text(encoding='utf-8'))
          typology = json.loads(Path('docs/data/typology_context.json').read_text(encoding='utf-8'))
          procurement = json.loads(Path('docs/data/procurement_status.json').read_text(encoding='utf-8'))

          assert triage['schema'] == 'RIGP-TRIAGE-v1'
          assert triage['relations'], 'triage sin relaciones publicadas'
          assert explore['schema'] == 'RIGP-EXPLORE-CONTEXT-v1'
          assert typology['schema'] == 'RIGP-TYPOLOGY-CONTEXT-v1'

          # Los dos ejes viajan separados: mezclarlos es lo que produjo una cola
          # encabezada por una factura de combustible.
          assert 'review_priority_score' in triage['axes']
          assert 'laft_compatibility_score' in triage['axes']
          for relation in triage['relations']:
              assert 'review_priority_score' in relation
              assert 'laft_compatibility_score' in relation
              assert relation['guardrail']

          # Ninguna tipología puede quedar sin criterio de descarte ni sin
          # documento que pedir: eso es lo que la separa de una imputación.
          for entry in typology['catalog']:
              assert entry['sustains'] and entry['discards'] and entry['documents'], entry['code']
              assert entry['question'].endswith('?')

          # Las capas no integradas tienen que declararse, no desaparecer.
          assert procurement['integration_state'] in {'SNAPSHOT_PRESENT', 'ADAPTER_READY_SOURCE_PENDING'}
          assert triage['coverage']['pending_layers'] is not None

          for path, cap in (
              ('docs/data/triage.json', 4_000_000),
              ('docs/data/explore_context.json', 900_000),
              ('docs/data/typology_context.json', 200_000),
          ):
              size = Path(path).stat().st_size
              assert size < cap, f'{path} pesa {size} y excede {cap}'
              print(f'{path}: {size / 1024:.1f} KiB')

          print('relaciones publicadas:', triage['coverage']['relations_published'])
          print('señales analizadas:', triage['source']['signals_total'])
          print('capas pendientes:', triage['coverage']['pending_layers'])
          PY

      # `spend_years_v1.json` (14 MiB) y `spend_view_v2.json` son insumos de
      # construcción, no activos web: ningún consumidor del sitio los descarga.
      # Se quedan en el repositorio y salen del artefacto publicado.
      - name: Stage site without build-only payloads
        run: |
          rm -rf _site
          cp -r docs _site
          rm -f _site/data/spend_years_v1.json _site/data/spend_view_v2.json
          echo "Publicado: $(du -sh _site | cut -f1) (docs completo: $(du -sh docs | cut -f1))"

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages aún no está habilitado. Activa Settings > Pages > Source: GitHub Actions."
          fi
      - name: Pages not enabled yet
        if: steps.pages.outputs.enabled != 'true'
        run: echo "::notice::Sitio listo. Falta habilitar GitHub Pages una sola vez en Settings > Pages > Source = GitHub Actions."
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
