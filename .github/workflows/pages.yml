name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/rigp_case_app.js'
      - 'docs/assets/rigp_case_app.css'
      - 'docs/data/investigative_findings.json'
      - 'docs/data/entity_enrichment_v1.json'
      - 'docs/data/procurement_context.json'
      - 'docs/data/mercado_publico_context.json'
      - 'scripts/build_findings_for_pages.py'
      - 'scripts/build_case_entity_context.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Bootstrap real 2026'
      - 'Radar monthly analysis'
      - 'Corrected Spend Data v3'
      - 'Enrich Spend Suppliers with SII'
      - 'Enrich procurement with Mercado Público'
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Detect canonical findings payload
        id: canonical_findings
        run: |
          if python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/investigative_findings.json')
          if not p.exists():
              raise SystemExit(1)
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          ok=(d.get('methodology_version') == 'RIGP-FINDINGS-v1' and bool(d.get('relation_findings')))
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo "canonical=true" >> "$GITHUB_OUTPUT"
            echo "[RIGP Pages] usando hallazgos del pipeline canónico"
          else
            echo "canonical=false" >> "$GITHUB_OUTPUT"
            echo "[RIGP Pages] hallazgos canónicos ausentes; se usará fallback compacto"
          fi
      - name: Build compact findings fallback for Pages
        if: steps.canonical_findings.outputs.canonical != 'true'
        run: python3 scripts/build_findings_for_pages.py
      - name: Build compact SII context for published providers
        run: python3 scripts/build_case_entity_context.py
      - name: Validate case-first web contract
        run: |
          node --check docs/assets/rigp_case_app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          findings=Path('docs/data/investigative_findings.json')
          entities=Path('docs/data/case_entity_context.json')
          f=json.loads(findings.read_text(encoding='utf-8'))
          e=json.loads(entities.read_text(encoding='utf-8'))
          assert f.get('methodology_version') in {'RIGP-FINDINGS-v1','RIGP-FINDINGS-PAGES-v1'}
          relations=f.get('relation_findings') or []
          assert relations, 'empty findings payload'
          assert len(relations) <= 800, 'published findings must remain bounded'
          assert findings.stat().st_size < 2_000_000, 'findings payload too large for safe startup'
          assert e.get('schema') == 'RIGP-CASE-ENTITY-CONTEXT-v1'
          assert entities.stat().st_size < 700_000, 'case entity context unexpectedly large'
          assert 'coverage' in e and 'entities' in e and 'guardrail' in e
          procurement=Path('docs/data/procurement_context.json')
          if procurement.exists():
              p=json.loads(procurement.read_text(encoding='utf-8'))
              assert p.get('schema') == 'RIGP-PROCUREMENT-CONTEXT-v1'
              assert procurement.stat().st_size < 800_000, 'procurement context unexpectedly large'
          mercado=Path('docs/data/mercado_publico_context.json')
          if mercado.exists():
              m=json.loads(mercado.read_text(encoding='utf-8'))
              assert m.get('schema') == 'RIGP-MERCADO-PUBLICO-CONTEXT-v1'
              assert mercado.stat().st_size < 1_500_000, 'Mercado Público context unexpectedly large'
          print('findings methodology:', f.get('methodology_version'))
          print('relations:', len(relations))
          print('findings KiB:', round(findings.stat().st_size/1024,1))
          print('entity context coverage:', e.get('coverage'))
          print('entity context KiB:', round(entities.stat().st_size/1024,1))
          PY
          test "$(grep -o 'assets/rigp_case_app.js' docs/index.html | wc -l)" -eq 1
          test "$(grep -o 'assets/rigp_case_app.css' docs/index.html | wc -l)" -eq 1
          ! grep -q 'spend_safe_' docs/index.html
          ! grep -q 'spend_v[0-9]' docs/index.html
          ! grep -q 'MutationObserver' docs/assets/rigp_case_app.js
          ! grep -q 'setInterval' docs/assets/rigp_case_app.js
          ! grep -q 'investigation_queue.json' docs/assets/rigp_case_app.js
          ! grep -q 'spend_years_v1.json' docs/assets/rigp_case_app.js
      - name: Build minimal Pages artifact
        run: |
          rm -rf public
          mkdir -p public/assets public/data
          cp docs/index.html public/index.html
          cp docs/assets/rigp_case_app.js public/assets/rigp_case_app.js
          cp docs/assets/rigp_case_app.css public/assets/rigp_case_app.css
          cp docs/data/investigative_findings.json public/data/investigative_findings.json
          cp docs/data/case_entity_context.json public/data/case_entity_context.json
          if [ -f docs/data/procurement_context.json ]; then
            cp docs/data/procurement_context.json public/data/procurement_context.json
          fi
          if [ -f docs/data/mercado_publico_context.json ]; then
            cp docs/data/mercado_publico_context.json public/data/mercado_publico_context.json
          fi
          touch public/.nojekyll
          echo '[RIGP Pages] artefacto mínimo:'
          find public -type f -printf '%p %s bytes\n' | sort
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages aún no está habilitado."
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deploy after transient OIDC failure
        id: deployment_retry
        if: steps.pages.outputs.enabled == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
