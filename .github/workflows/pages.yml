name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_findings_for_pages.py'
      - 'scripts/build_explore_context_for_pages.py'
      - 'scripts/build_benefit_context_for_pages.py'
      - 'scripts/build_ownership_resolution_queue.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Bootstrap real 2026'
      - 'Radar monthly analysis'
      - 'Corrected Spend Data v3'
      - 'Enrich Spend Suppliers with SII'
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # No cancelar un deploy válido si llega, mientras publica, otro workflow_run
  # que finalmente será omitido por la condición del job.
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Detect canonical findings payload
        id: canonical_findings
        run: |
          if python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/investigative_findings.json')
          if not p.exists():
              raise SystemExit(1)
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          ok=(d.get('methodology_version') == 'RIGP-FINDINGS-v1' and bool(d.get('relation_findings')))
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo "canonical=true" >> "$GITHUB_OUTPUT"
            echo "[RIGP Pages] usando investigative_findings.json del pipeline canónico"
          else
            echo "canonical=false" >> "$GITHUB_OUTPUT"
            echo "[RIGP Pages] hallazgos canónicos ausentes; se usará fallback compacto"
          fi
      - name: Build compact findings fallback for Pages
        if: steps.canonical_findings.outputs.canonical != 'true'
        run: python3 scripts/build_findings_for_pages.py
      - name: Build compact explore context for Pages
        run: python3 scripts/build_explore_context_for_pages.py
      - name: Build compact benefit context for Pages
        run: python3 scripts/build_benefit_context_for_pages.py
      - name: Build ownership resolution queue for Pages
        run: python3 scripts/build_ownership_resolution_queue.py
      - name: Validate compact web payloads
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          findings=Path('docs/data/investigative_findings.json')
          explore=Path('docs/data/explore_context.json')
          benefit=Path('docs/data/benefit_context.json')
          ownership=Path('docs/data/ownership_resolution_queue.json')
          assert findings.exists(), 'missing compact findings payload'
          assert explore.exists(), 'missing compact explore payload'
          assert benefit.exists(), 'missing compact benefit payload'
          assert ownership.exists(), 'missing ownership resolution payload'
          f=json.loads(findings.read_text())
          e=json.loads(explore.read_text())
          b=json.loads(benefit.read_text())
          o=json.loads(ownership.read_text())
          assert f.get('methodology_version') in {'RIGP-FINDINGS-v1','RIGP-FINDINGS-PAGES-v1'}, 'unexpected findings methodology'
          assert f.get('relation_findings'), 'empty compact findings payload'
          assert e.get('schema') == 'RIGP-EXPLORE-CONTEXT-v1'
          assert e.get('services'), 'empty service explore context'
          assert b.get('schema') == 'RIGP-BENEFIT-CONTEXT-v1'
          assert b.get('candidates'), 'empty benefit candidate context'
          assert b.get('guardrail'), 'benefit guardrail missing'
          assert o.get('schema') == 'RIGP-OWNERSHIP-RESOLUTION-v1'
          assert o.get('queue'), 'empty ownership resolution queue'
          assert o.get('published_candidates',0) <= 300, 'ownership queue cap exceeded'
          assert findings.stat().st_size < 1_500_000, 'findings payload too large for safe startup'
          assert explore.stat().st_size < 600_000, 'explore payload unexpectedly large'
          assert benefit.stat().st_size < 500_000, 'benefit payload unexpectedly large'
          assert ownership.stat().st_size < 350_000, 'ownership payload unexpectedly large'
          print('findings methodology:', f.get('methodology_version'))
          print('findings relations:', len(f.get('relation_findings',[])))
          print('findings KiB:', round(findings.stat().st_size/1024,1))
          print('explore KiB:', round(explore.stat().st_size/1024,1))
          print('benefit KiB:', round(benefit.stat().st_size/1024,1))
          print('ownership KiB:', round(ownership.stat().st_size/1024,1))
          print('explore coverage:', e.get('coverage'))
          print('benefit coverage:', b.get('coverage'))
          print('ownership published:', o.get('published_candidates'))
          PY
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages aún no está habilitado. Activa Settings > Pages > Source: GitHub Actions."
          fi
      - name: Pages not enabled yet
        if: steps.pages.outputs.enabled != 'true'
        run: echo "::notice::Dashboard listo. Falta habilitar GitHub Pages una sola vez en Settings > Pages > Source = GitHub Actions."
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
