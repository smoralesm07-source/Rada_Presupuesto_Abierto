name: Check RIGP Guided Flow
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_guided_flow.js'
      - 'docs/assets/spend_safe_guided_flow.css'
      - '.github/workflows/check-guided-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate guided runtime
        run: |
          node --check docs/assets/spend_safe_guided_flow.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_guided_flow.js
          ! grep -q 'setInterval' docs/assets/spend_safe_guided_flow.js
          ! grep -q 'investigation_queue.json' docs/assets/spend_safe_guided_flow.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_guided_flow.js
      - name: Validate information architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('docs/index.html').read_text(encoding='utf-8')
          js=Path('docs/assets/spend_safe_guided_flow.js').read_text(encoding='utf-8')
          css=Path('docs/assets/spend_safe_guided_flow.css').read_text(encoding='utf-8')
          block=re.search(r'<nav class="nav nav-primary">(.*?)</nav>',html,re.S)
          assert block, 'primary navigation missing'
          buttons=re.findall(r'<button\b',block.group(1))
          assert len(buttons)==5, f'primary navigation must stay at 5 buttons, got {len(buttons)}'
          for needle in ['data-view="inicio"','data-view="bandeja"','data-view="explorar"','data-actor-view','data-benefit-view','Vistas de apoyo','spend_safe_guided_flow.js?v=2','spend_safe_guided_flow.css?v=2']:
              assert needle in html, f'index missing {needle}'
          for needle in ["key:'prioritize'","key:'investigate'","key:'actors'","key:'benefit'",'Lee RIGP como una secuencia','Resultado esperado','data-gf-support','Más contexto','1 · Resumen','4 · Decisión','señal analítica → hechos y documentos → actores e identidad → beneficio económico']:
              assert needle in js, f'guided flow missing {needle}'
          for needle in ['.gf-steps','.gf-step.active','.nav-tools','body[data-rigp-stage="home"]','body[data-rigp-stage="investigate"] #filtersWrap','rigp-show-support','1 · Qué ocurrió','2 · Por qué importa','3 · Cómo se repite']:
              assert needle in css, f'guided style missing {needle}'
          assert 'nth-child(n+4){display:none}' in css, 'secondary investigate panels must be collapsed by default'
          print('[OK] guided information architecture and progressive disclosure contract')
          PY
