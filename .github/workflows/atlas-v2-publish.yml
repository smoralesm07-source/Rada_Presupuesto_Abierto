name: Publish Presupuesto Abierto to ATLAS v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-v2-publish.yml'
  workflow_run:
    workflows: ['Corrected Spend Data v3']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-v2-presupuesto-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current governed snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build ATLAS v2 source and detail batches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path

          src=Path('docs/data/spend_view_v2.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          if data.get('schema')!='PRESUPUESTO_SPEND_VIEW_V2':
              raise SystemExit('unexpected source schema')
          generated=data.get('generated_at')
          if not generated: raise SystemExit('source generated_at missing')
          overview=data.get('overview') or {}
          window=data.get('window') or {}
          monthly=data.get('monthly') or []
          if not overview or not window or not monthly: raise SystemExit('required analytical sections missing')

          def sid(row): return str(row.get('organization_id') or row.get('buyer_id') or row.get('id') or '').strip()
          def pid(row): return str(row.get('provider_id') or row.get('supplier_id') or row.get('id') or '').strip()
          def fsid(row): return str(row.get('organization_id') or row.get('buyer_id') or '').strip()
          def fpid(row): return str(row.get('provider_id') or row.get('supplier_id') or '').strip()
          def dedupe(rows,keyfn):
              out={}
              for row in rows:
                  key=keyfn(row)
                  if key: out[key]=row
              return list(out.values())
          def num(row,*keys):
              for key in keys:
                  try:
                      v=row.get(key)
                      if v is not None: return float(v)
                  except Exception: pass
              return 0.0

          services=dedupe(list(data.get('services') or []),sid)
          providers=dedupe(list(data.get('providers') or []),pid)
          flows=dedupe(list(data.get('flows') or []),lambda r:(fsid(r)+'|'+fpid(r)) if fsid(r) and fpid(r) else '')
          services=sorted(services,key=lambda r:num(r,'amount_l12','amount_clp'),reverse=True)
          providers=sorted(providers,key=lambda r:num(r,'amount_l12','amount_clp'),reverse=True)
          flows=sorted(flows,key=lambda r:num(r,'amount_l12','amount_clp'),reverse=True)

          top_services=services[:50]
          top_providers=providers[:100]
          end=str(window.get('end_month') or 'unknown')[:7].replace('-','')
          sha=os.environ.get('GITHUB_SHA','unknown')
          snapshot_id=f'PA-{end}-{sha[:12]}'
          payload={
              'contract':'ATLAS_BUDGET_EXECUTION_SOURCE_V2',
              'source':data.get('source') or {},
              'window':window,
              'overview':overview,
              'monthly':monthly,
              'top_services':top_services,
              'top_providers':top_providers,
              'quality':{
                  'semantic_status':'CORRECTED_V3_GOVERNED',
                  'detail_mode':'TOP_ONLY',
                  'full_service_count':len(services),
                  'full_provider_count':len(providers),
                  'legacy_flow_count':len(flows),
                  'published_top_services':len(top_services),
                  'published_top_providers':len(top_providers),
                  'rule':'Overview and ranking are compact; complete current GP2 drill-down is loaded separately into private ATLAS v2 tables.'
              }
          }
          body={
              'operation':'source_snapshot',
              'source_key':'presupuesto_abierto_l12',
              'snapshot_id':snapshot_id,
              'contract':'ATLAS_BUDGET_EXECUTION_SOURCE_V2',
              'generated_at':generated,
              'source_versions':{
                  'source_schema':data.get('schema'),
                  'publisher_workflow':'atlas-v2-publish.yml',
                  'producer_sha':sha,
                  'detail_mode':'TOP_ONLY'
              },
              'payload':payload
          }
          source_out=Path('/tmp/atlas-v2-source.json')
          source_out.write_text(json.dumps(body,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')
          plan={'snapshot_id':snapshot_id,'services':len(services),'providers':len(providers),'flows':len(flows)}
          Path('/tmp/atlas-v2-plan.json').write_text(json.dumps(plan,separators=(',',':')),encoding='utf-8')

          batch_dir=Path('/tmp/atlas-v2-batches'); batch_dir.mkdir(exist_ok=True)
          seq=0
          for kind,rows in [('services',services),('providers',providers),('flows',flows)]:
              for start in range(0,len(rows),100):
                  seq+=1
                  batch={'operation':'budget_detail_batch','snapshot_id':snapshot_id,'kind':kind,'rows':rows[start:start+100]}
                  (batch_dir/f'{seq:04d}-{kind}.json').write_text(json.dumps(batch,ensure_ascii=False,separators=(',',':'),allow_nan=False),encoding='utf-8')

          print(json.dumps({**plan,
              'batches':seq,
              'source_bytes':source_out.stat().st_size,
              'source_sha256':hashlib.sha256(source_out.read_bytes()).hexdigest()
          },ensure_ascii=False))
          PY

      - name: Obtain GitHub OIDC token for ATLAS v2
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=atlas-v2-source-ingest"
          TOKEN_JSON=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL")
          OIDC=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")
          test -n "$OIDC"
          echo "token=$OIDC" >> "$GITHUB_OUTPUT"

      - name: Publish source, full detail batches and finalize
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          ENDPOINT='https://bzqxvidggykkdouotylg.supabase.co/functions/v1/atlas-v2-source-ingest'
          post() {
            local file="$1" label="$2"
            local code
            code=$(curl --silent --show-error --output /tmp/atlas-v2-response.json --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' \
              --data-binary "@$file" "$ENDPOINT")
            if [ "$code" != "200" ]; then echo "[$label] HTTP $code"; cat /tmp/atlas-v2-response.json; exit 1; fi
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/atlas-v2-response.json',encoding='utf-8'))
          if r.get('ok') is not True: raise SystemExit(r)
          PY
          }

          post /tmp/atlas-v2-source.json source_snapshot
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/atlas-v2-plan.json'))
          req={'operation':'budget_detail_init','snapshot_id':p['snapshot_id'],'expected_services':p['services'],'expected_providers':p['providers'],'expected_flows':p['flows']}
          json.dump(req,open('/tmp/atlas-v2-init.json','w'),separators=(',',':'))
          PY
          post /tmp/atlas-v2-init.json detail_init

          for file in /tmp/atlas-v2-batches/*.json; do
            post "$file" "$(basename "$file")"
          done

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/atlas-v2-plan.json'))
          json.dump({'operation':'budget_detail_finalize','snapshot_id':p['snapshot_id']},open('/tmp/atlas-v2-finalize.json','w'),separators=(',',':'))
          PY
          post /tmp/atlas-v2-finalize.json detail_finalize
          cat /tmp/atlas-v2-response.json
          echo 'ATLAS v2 budget execution publication READY'
