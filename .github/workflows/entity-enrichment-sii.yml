name: Enrich Spend Suppliers with SII
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_entity_enrichment_sii.py'
      - 'docs/data/spend_years_v1.json'
      - '.github/workflows/entity-enrichment-sii.yml'
  workflow_run:
    workflows:
      - 'Corrected Spend Data v3'
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '15 11 12 * *'
permissions:
  contents: write
concurrency:
  group: entity-enrichment-sii
  cancel-in-progress: true
jobs:
  enrich:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Checkout Radar SII
        uses: actions/checkout@v6
        with:
          repository: smoralesm07-source/Radar_SII
          path: external/radar-sii
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Radar SII runtime
        run: python -m pip install -r external/radar-sii/requirements.txt
      - name: Build selective SII extract
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PYTHONPATH=external/radar-sii/src python scripts/build_entity_enrichment_sii.py 2>&1 | tee /tmp/sii-enrichment.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE
      - name: Validate enrichment
        id: validate
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          p='docs/data/entity_enrichment_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('schema')=='PRESUPUESTO_ENTITY_ENRICHMENT_V1'
          src=d.get('sources',{}).get('RADAR_SII',{})
          assert src.get('status')=='SELECTIVE_RUT_EXTRACT_READY'
          assert src.get('matched_entities',0)>0
          print('[OK]',src)
          PY
      - name: Write enrichment status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_CODE: ${{ steps.build.outputs.exit_code }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/sii-enrichment.log')
          lines=log.read_text(encoding='utf-8',errors='replace').splitlines() if log.exists() else []
          payload={
            'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'workflow':'Enrich Spend Suppliers with SII',
            'trigger':os.environ.get('TRIGGER'),
            'build':os.environ.get('BUILD_OUTCOME') or 'unknown',
            'exit_code':int(os.environ.get('BUILD_CODE') or -1),
            'validation':os.environ.get('VALIDATE_OUTCOME') or 'skipped',
            'data_ready':Path('docs/data/entity_enrichment_v1.json').exists(),
            'supplier_universe':'docs/data/spend_years_v1.json',
            'upstream':'Corrected Spend Data v3',
            'log_tail':lines[-80:]
          }
          Path('docs/data/entity_enrichment_sii_status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publish enrichment and status
        if: always()
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/entity_enrichment_sii_status.json
          if [ -f docs/data/entity_enrichment_v1.json ]; then git add docs/data/entity_enrichment_v1.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publica enriquecimiento SII de proveedores"
          git pull --rebase origin main
          git push origin main
      - name: Fail if enrichment failed
        if: steps.build.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
