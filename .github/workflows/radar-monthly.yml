name: Radar monthly analysis
on:
  push:
    branches: [main]
    paths:
      - 'src/radar_presupuesto/spend_view.py'
      - 'src/radar_presupuesto/pipeline.py'
      - 'src/radar_presupuesto/investigative_findings.py'
      - 'src/radar_presupuesto/prioritization.py'
      - 'src/radar_presupuesto/advanced_signals.py'
      - 'src/radar_presupuesto/cgr_correlation.py'
      - 'src/radar_presupuesto/analysis_window.py'
      - 'src/radar_presupuesto/peer_groups.py'
      - 'src/radar_presupuesto/signal_health.py'
      - 'src/radar_presupuesto/pattern_compatibility.py'
      - 'src/radar_presupuesto/publication_selection.py'
      - 'src/radar_presupuesto/procurement_context.py'
      - 'src/radar_presupuesto/operational_bundle.py'
      - 'src/radar_presupuesto/run_summary.py'
      - 'src/radar_presupuesto/browser_publication.py'
      - 'config/anomaly_thresholds.yaml'
      - '.github/workflows/radar-monthly.yml'
  workflow_dispatch:
    inputs:
      years:
       description: 'Años separados por espacio; vacío = últimos 3 bulk disponibles'
        required: false
        default: ''
      skip_index:
        description: 'Omitir la reconstrucción del índice FTS (usar en series largas)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '31 9 10 * *'
permissions:
  contents: write
concurrency:
  group: rigp-operational-radar
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Radar CGR evidence
        uses: actions/checkout@v6
        with:
          repository: smoralesm07-source/Radar-CGR
          path: external/radar-cgr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Probe sources
        run: PYTHONPATH=src python -m radar_presupuesto.cli probe

      - name: Resolve historical analysis window
        id: years
        env:
          REQUESTED: ${{ github.event.inputs.years }}
        run: |
          YEARS=$(PYTHONPATH=src python - <<'PY'
          import os
          from radar_presupuesto.analysis_window import resolve_analysis_years, describe_window
          requested=os.environ.get('REQUESTED','').strip()
          years=resolve_analysis_years(
              catalog_path='docs/data/source_catalog.json',
              requested=requested or None,
              window_years=7,
              min_years=5,
          )
          print(' '.join(map(str,years)))
          print('[RIGP window]',describe_window(years),file=__import__('sys').stderr)
          PY
          )
          test -n "$YEARS"
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "RIGP analysis years: $YEARS"

      - name: Run integrated operational radar
        run: |
          PYTHONPATH=src python -m radar_presupuesto.pipeline \
            --years ${{ steps.years.outputs.years }} \
            --skip-index \
            --skip-legacy-spend-view

      - name: Build case entity context from available SII enrichment
        run: python3 scripts/build_case_entity_context.py

      - name: Build territorial context export
        run: PYTHONPATH=src python -m radar_presupuesto.territorial_export

      - name: Compact browser publication
        run: PYTHONPATH=src python -m radar_presupuesto.browser_publication

      - name: Build canonical run summary
        run: PYTHONPATH=src python -m radar_presupuesto.run_summary

      - name: Validate integrated operational products
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.load(open('docs/data/investigative_findings.json',encoding='utf-8'))
          b=json.load(open('docs/data/operational_bundle.json',encoding='utf-8'))
          h=json.load(open('docs/data/signal_health.json',encoding='utf-8'))
          p=json.load(open('docs/data/procurement_context.json',encoding='utf-8'))
          c=json.load(open('docs/data/case_entity_context.json',encoding='utf-8'))
          s=json.load(open('docs/data/radar_run_summary.json',encoding='utf-8'))
          assert b['schema']=='RIGP-OPERATIONAL-BUNDLE-v1'
          assert h['schema']=='RIGP-SIGNAL-HEALTH-v1'
          assert p['schema']=='RIGP-PROCUREMENT-CONTEXT-v1'
          assert c['schema']=='RIGP-CASE-ENTITY-CONTEXT-v1'
          assert s['schema']=='RIGP-RUN-SUMMARY-v1'
          assert f.get('browser_publication',{}).get('schema')=='RIGP-BROWSER-PUBLICATION-v1'
          assert f.get('browser_publication',{}).get('analytical_effect')=='NONE'
          assert b['analysis_window']['year_count'] >= 5
          assert s['analysis_window']['effective_year_count'] >= 5
          assert len(f.get('relation_findings') or []) <= 600
          assert len(f.get('service_hotspots') or []) <= 80
          assert len(f.get('provider_hotspots') or []) <= 80
          assert len(f.get('network_candidates') or []) <= 80
          assert f.get('publication_selection',{}).get('method')=='priority_with_signal_diversity_reserve'
          assert 'interpretation_contract' in f
          assert 'context_coverage' in f
          assert 'statuses' in s['signals']
          assert 'published_by_signal' in s['findings']
          assert 0 <= s['context']['peer_context_coverage'] <= 1
          assert 0 <= s['procurement']['purchase_order_coverage'] <= 1
          assert 0 <= s['sii']['context_coverage'] <= 1
          for row in (f.get('relation_findings') or [])[:20]:
              assert 'review_priority' in row
              assert 'primary_pattern' in row
              assert 'peer_context' in row
          size=Path('docs/data/investigative_findings.json').stat().st_size
          summary_size=Path('docs/data/radar_run_summary.json').stat().st_size
          assert size < 2_000_000, f'browser payload too large: {size} bytes'
          assert summary_size < 200_000, f'run summary too large: {summary_size} bytes'
          print('browser_payload_bytes',size)
          print('run_summary_bytes',summary_size)
          print('browser_compaction',f['browser_publication'])
          print('analysis_window',s['analysis_window'])
          print('signal_health',s['signals'])
          print('finding_context_coverage',s['context'])
          print('procurement_context',s['procurement'])
          print('sii_context',s['sii'])
          PY

      - name: Persist operational summaries only
        run: |
          # IMPORTANTE: spend_view_v2.json y spend_years_v1.json son propiedad de
          # Corrected Spend Data v3. Esta corrida case-first no los reconstruye ni publica.
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          for f in \
            docs/data/dashboard.json \
            docs/data/investigation_queue.json \
            docs/data/investigative_findings.json \
            docs/data/cgr_correlation.json \
            docs/data/source_catalog.json \
            docs/data/coverage.json \
            docs/data/quality.json \
            docs/data/snapshot_manifest.json \
            docs/data/territorial_context_v1.json \
            docs/data/signal_health.json \
            docs/data/operational_bundle.json \
            docs/data/procurement_context.json \
            docs/data/case_entity_context.json \
            docs/data/radar_run_summary.json \
            docs/data/sii_document_candidates_status.json
          do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: corrida operacional integrada $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
