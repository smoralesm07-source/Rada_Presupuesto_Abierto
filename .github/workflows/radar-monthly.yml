name: Radar monthly analysis
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Años separados por espacio; vacío = últimos 3 bulk disponibles'
        required: false
        default: ''
  schedule:
    - cron: '31 9 10 * *'
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe sources
        run: PYTHONPATH=src python -m radar_presupuesto.cli probe
      - name: Resolve years
        id: years
        env:
          REQUESTED: ${{ github.event.inputs.years }}
        run: |
          if [ -n "$REQUESTED" ]; then echo "years=$REQUESTED" >> "$GITHUB_OUTPUT"; exit 0; fi
          YEARS=$(python - <<'PY'
          import json
          d=json.load(open('docs/data/source_catalog.json'))
          ys=[str(x['year']) for x in d.get('downloads',[]) if x.get('status') in ('linked','probed_available')]
          print(' '.join(ys[-3:]))
          PY
          )
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
      - name: Run radar
        run: |
          test -n "${{ steps.years.outputs.years }}"
          PYTHONPATH=src python -m radar_presupuesto.pipeline --years ${{ steps.years.outputs.years }}
      - name: Persist publishable summaries only
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/dashboard.json docs/data/source_catalog.json docs/data/coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: corrida analítica $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
