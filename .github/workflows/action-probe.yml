name: Action probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/action-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish probe
        run: |
          mkdir -p docs/data
          printf '{"status":"OK","workflow":"Action probe","commit":"%s"}\n' "$GITHUB_SHA" > docs/data/action_probe.json
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/action_probe.json
          git commit -m "ci: confirma ejecución de Actions"
          git pull --rebase origin main
          git push origin main
