name: Check RIGP Home UX
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_home.js'
      - 'docs/assets/spend_safe_home.css'
      - '.github/workflows/check-home-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate home runtime
        run: |
          node --check docs/assets/spend_safe_home.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_home.js
          ! grep -q 'setInterval' docs/assets/spend_safe_home.js
          ! grep -q 'investigation_queue.json' docs/assets/spend_safe_home.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_home.js
      - name: Validate decision home
        run: |
          grep -q 'assets/spend_safe_home.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_home.css?v=1' docs/index.html
          grep -q 'Empieza por una sola decisión' docs/assets/spend_safe_home.js
          grep -q 'Retoma la investigación donde la dejaste' docs/assets/spend_safe_home.js
          grep -q 'Continuar foco actual' docs/assets/spend_safe_home.js
          grep -q 'Siguiente recomendado' docs/assets/spend_safe_home.js
          grep -q 'Priorizar → Investigar → Actores → Beneficio' docs/assets/spend_safe_home.js
          grep -q 'data-home-focus' docs/assets/spend_safe_home.js
