name: Check RIGP App Shell
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_v3.js'
      - 'docs/assets/spend_safe_v3.css'
      - 'docs/assets/spend_safe_network.js'
      - 'docs/assets/spend_safe_network.css'
      - '.github/workflows/check-app-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate current JavaScript
        run: |
          node --check docs/assets/spend_safe_v3.js
          node --check docs/assets/spend_safe_network.js
      - name: Validate navigation contract
        run: |
          grep -q 'data-view="inicio"' docs/index.html
          grep -q 'data-view="bandeja"' docs/index.html
          grep -q 'data-view="hallazgos"' docs/index.html
          grep -q 'data-view="servicios"' docs/index.html
          grep -q 'data-view="proveedores"' docs/index.html
          grep -q 'data-view="explorar"' docs/index.html
          grep -q 'data-network-view' docs/index.html
          grep -q 'Foco activo' docs/assets/spend_safe_v3.js
          grep -q 'Red investigativa ligera' docs/assets/spend_safe_network.js
      - name: Ensure safe browser architecture
        run: |
          ! grep -q 'MutationObserver' docs/assets/spend_safe_v3.js
          ! grep -q 'setInterval' docs/assets/spend_safe_v3.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_network.js
          ! grep -q 'setInterval' docs/assets/spend_safe_network.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_v3.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_network.js
          grep -q 'explore_context.json' docs/assets/spend_safe_v3.js
          grep -q 'explore_context.json' docs/assets/spend_safe_network.js
          grep -q 'MAX_NODES=12' docs/assets/spend_safe_network.js
      - name: Ensure compact publication remains enabled
        run: |
          grep -q 'Build compact findings payload for Pages' .github/workflows/pages.yml
          grep -q 'Build compact explore context for Pages' .github/workflows/pages.yml
