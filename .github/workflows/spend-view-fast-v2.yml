name: Legacy Spend View v2 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Build Spend View v2 fast quedó retirado como publicador."
          echo "Los artefactos docs/data/spend_view_v2.json y docs/data/spend_years_v1.json son propiedad de Corrected Spend Data v3."
          echo "Motivo: la v2 modelaba servicio a nivel Partida+Capítulo+Área y podía recalcular métricas sobre relaciones visualmente recortadas."
