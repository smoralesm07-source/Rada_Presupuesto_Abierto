name: Build Spend View v2 fast
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spend-view-fast-v2.yml'
      - 'src/radar_presupuesto/spend_view_fast.py'
      - 'src/radar_presupuesto/spend_view_fast2.py'
      - 'scripts/compact_spend_view.py'
      - 'scripts/build_spend_years_v1.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spend-view-fast-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download latest three official bulk files
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from radar_presupuesto.extract import download
          catalog=json.load(open('docs/data/source_catalog.json',encoding='utf-8'))
          ok={'linked','linked_available','probed_available'}
          rows=[x for x in catalog.get('downloads',[]) if x.get('status') in ok][-3:]
          if len(rows)<2: raise SystemExit('No hay cobertura suficiente')
          Path('data/raw').mkdir(parents=True,exist_ok=True)
          for r in rows:
              path=Path('data/raw')/f"pagos-{r['year']}.gz"
              download(r['url'],path)
              print('[OK] download',r['year'],path)
          Path('/tmp/spend-years.txt').write_text(' '.join(str(r['year']) for r in rows))
          PY
      - name: Build lightweight real L12 view
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          YEARS=$(cat /tmp/spend-years.txt)
          PATHS=""
          for Y in $YEARS; do PATHS="$PATHS data/raw/pagos-$Y.gz"; done
          PYTHONPATH=src python -m radar_presupuesto.spend_view_fast2 $PATHS --output docs/data/spend_view_v2.json 2>&1 | tee /tmp/spend-view-fast.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE
      - name: Build multiyear explorer payload
        id: multiyear
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/build_spend_years_v1.py --parquet data/processed/spend_view_light.parquet --output docs/data/spend_years_v1.json --flows-per-service-year 3 --global-flow-cap 12000
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/spend_years_v1.json','utf8'));
          if(d.schema!=='PRESUPUESTO_SPEND_YEARS_V1') throw new Error('unexpected multiyear schema');
          if(!Array.isArray(d.years)||d.years.length<2) throw new Error('insufficient multiyear coverage');
          if(!Array.isArray(d.reference_entities)||!d.reference_entities.some(x=>x.role==='UAF_REFERENCE')) throw new Error('UAF reference not found');
          console.log('[OK] multiyear',d.years,d.reference_entities);
          JS
      - name: Compact and validate browser JSON
        id: strict_json
        if: steps.build.outcome == 'success'
        run: |
          python scripts/compact_spend_view.py --input docs/data/spend_view_v2.json --output docs/data/spend_view_v2.json --max-flows 3200 --per-service 2
          python - <<'PY'
          import json
          p='docs/data/spend_view_v2.json'
          with open(p,encoding='utf-8') as f:
              d=json.load(f, parse_constant=lambda x: (_ for _ in ()).throw(ValueError(f'non-standard JSON constant: {x}')))
          assert d.get('schema') == 'PRESUPUESTO_SPEND_VIEW_V2'
          print('[OK] strict browser JSON', d.get('published'))
          PY
      - name: Write fast-build status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_CODE: ${{ steps.build.outputs.exit_code }}
          STRICT_OUTCOME: ${{ steps.strict_json.outcome }}
          MULTIYEAR_OUTCOME: ${{ steps.multiyear.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          log=Path('/tmp/spend-view-fast.log')
          lines=log.read_text(encoding='utf-8',errors='replace').splitlines() if log.exists() else []
          p={'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'workflow':'Build Spend View v2 fast','outcome':os.environ.get('BUILD_OUTCOME') or 'UNKNOWN','exit_code':int(os.environ.get('BUILD_CODE') or -1),'strict_json':os.environ.get('STRICT_OUTCOME') or 'skipped','multiyear':os.environ.get('MULTIYEAR_OUTCOME') or 'skipped','data_ready':Path('docs/data/spend_view_v2.json').exists(),'multiyear_ready':Path('docs/data/spend_years_v1.json').exists(),'log_tail':lines[-100:]}
          Path('docs/data').mkdir(parents=True,exist_ok=True)
          Path('docs/data/spend_view_v2_fast_status.json').write_text(json.dumps(p,ensure_ascii=False,indent=2,allow_nan=False),encoding='utf-8')
          PY
      - name: Publish real spend data and build status
        if: always()
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/spend_view_v2_fast_status.json
          if [ -f docs/data/spend_view_v2.json ]; then git add docs/data/spend_view_v2.json; fi
          if [ -f docs/data/spend_years_v1.json ]; then git add docs/data/spend_years_v1.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publica vista gasto multianual"
          git pull --rebase origin main
          git push origin main
      - name: Fail if build, strict JSON or multiyear validation failed
        if: steps.build.outcome != 'success' || steps.strict_json.outcome != 'success' || steps.multiyear.outcome != 'success'
        run: exit 1
