name: Check RIGP Benefit UX
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_benefit_ux.js'
      - 'docs/assets/spend_safe_benefit_ux.css'
      - '.github/workflows/check-benefit-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate benefit UX runtime
        run: |
          node --check docs/assets/spend_safe_benefit_ux.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_benefit_ux.js
          ! grep -q 'setInterval' docs/assets/spend_safe_benefit_ux.js
          ! grep -q 'investigation_queue.json' docs/assets/spend_safe_benefit_ux.js
          ! grep -q 'spend_years_v1.json' docs/assets/spend_safe_benefit_ux.js
      - name: Validate evidence-first benefit flow
        run: |
          grep -q 'assets/spend_safe_benefit_ux.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_benefit_ux.css?v=1' docs/index.html
          grep -q 'Qué está acreditado' docs/assets/spend_safe_benefit_ux.js
          grep -q 'Qué puede sostenerse hoy' docs/assets/spend_safe_benefit_ux.js
          grep -q 'Qué vínculo falta documentar' docs/assets/spend_safe_benefit_ux.js
          grep -q 'Contexto de apoyo' docs/assets/spend_safe_benefit_ux.js
          grep -q 'Registrar nuevo vínculo documentado' docs/assets/spend_safe_benefit_ux.js
          grep -q 'benefit-support-fold' docs/assets/spend_safe_benefit_ux.css
