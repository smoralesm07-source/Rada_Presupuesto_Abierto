name: UAF provider ranking 2025
run-name: Ranking proveedores UAF 2025
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uaf-provider-ranking.yml'
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Calculate UAF provider ranking from official 2025 bulk
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd

          from radar_presupuesto.extract import download
          from radar_presupuesto.ids import normalize_rut, normalize_text

          year = 2025
          target = 'UNIDAD DE ANALISIS FINANCIERO'
          source_url = 'https://api.presupuestoabierto.gob.cl/data/pagos-2025.gz'
          raw = Path('data/raw/pagos-2025.gz')
          meta = download(source_url, raw)
          cols = ['periodo','mes','nombre_partida','nombre_capitulo','nombre_area','beneficiario','nombre_beneficiario','numero_documento','monto','proveedor']
          true_values = {'1','TRUE','T','SI','SÍ','YES','Y'}
          stats = defaultdict(lambda: {'provider_id':None,'rut':None,'provider_name':None,'source_id':None,'amount_paid_clp':0.0,'payment_rows':0,'document_ids':set(),'months':set()})
          matched_rows = 0
          org_examples = set()

          for chunk in pd.read_csv(raw, compression='gzip', sep='\t', encoding='utf-8-sig', dtype=str, usecols=cols, chunksize=300_000, low_memory=False):
              partida = chunk['nombre_partida'].fillna('').map(normalize_text)
              capitulo = chunk['nombre_capitulo'].fillna('').map(normalize_text)
              area = chunk['nombre_area'].fillna('').map(normalize_text)
              is_uaf = partida.eq(target) | capitulo.eq(target) | area.eq(target)
              is_provider = chunk['proveedor'].fillna('').astype(str).str.strip().str.upper().isin(true_values)
              periodo = pd.to_numeric(chunk['periodo'], errors='coerce')
              sub = chunk.loc[is_uaf & is_provider & periodo.eq(year)].copy()
              if sub.empty:
                  continue
              matched_rows += len(sub)
              sub['monto_num'] = pd.to_numeric(sub['monto'], errors='coerce').fillna(0.0)
              for r in sub.itertuples(index=False):
                  raw_id = str(r.beneficiario or '').strip()
                  rut = normalize_rut(raw_id)
                  pname = str(r.nombre_beneficiario or '').strip()
                  key = f'RUT::{rut}' if rut else (f'SRC::{raw_id}' if raw_id else f'NAME::{normalize_text(pname)}')
                  s = stats[key]
                  s['provider_id'] = f'PRV-RUT-{rut}' if rut else None
                  s['rut'] = rut or None
                  s['source_id'] = raw_id or None
                  s['provider_name'] = pname or None
                  s['amount_paid_clp'] += float(r.monto_num)
                  s['payment_rows'] += 1
                  if r.numero_documento:
                      s['document_ids'].add(str(r.numero_documento))
                  try:
                      if r.mes not in (None, ''):
                          s['months'].add(int(float(r.mes)))
                  except Exception:
                      pass
                  org_examples.add((str(r.nombre_partida or ''), str(r.nombre_capitulo or ''), str(r.nombre_area or '')))

          ranking = []
          for s in stats.values():
              ranking.append({'provider_id':s['provider_id'],'rut':s['rut'],'source_id':s['source_id'],'provider_name':s['provider_name'],'amount_paid_clp':round(s['amount_paid_clp'],2),'payment_rows':s['payment_rows'],'distinct_documents':len(s['document_ids']),'months_with_payments':sorted(s['months'])})
          ranking.sort(key=lambda x: x['amount_paid_clp'], reverse=True)
          total_paid = sum(x['amount_paid_clp'] for x in ranking)
          for x in ranking:
              x['share_of_uaf_provider_payments'] = round(x['amount_paid_clp']/total_paid, 6) if total_paid else 0

          out = {'generated_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'year':year,'institution':'Unidad de Análisis Financiero','institution_match':'exact normalized match in nombre_partida OR nombre_capitulo OR nombre_area','provider_rule':'source field proveedor interpreted as true','metric':'sum(MONTO) by provider; MONTO maps to monto_pago in Radar normalization','source_url':source_url,'source_sha256':meta.get('sha256'),'matched_payment_rows':matched_rows,'distinct_providers':len(ranking),'total_paid_to_providers_clp':round(total_paid,2),'top10':ranking[:10],'organization_examples':[list(x) for x in sorted(org_examples)[:10]],'note':'Ranking por monto total pagado neto. Se conservan ajustes negativos de fuente. payment_rows es número de filas fuente; distinct_documents cuenta números de documento distintos.'}
          Path('docs/data').mkdir(parents=True, exist_ok=True)
          Path('docs/data/uaf_providers_2025.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          assert matched_rows > 0, 'No se encontraron pagos UAF 2025 a registros marcados como proveedor'
          assert ranking and ranking[0]['amount_paid_clp'] > 0
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Persist ranking
        run: |
          git config user.name "radar-presupuesto-bot"
          git config user.email "radar-presupuesto-bot@users.noreply.github.com"
          git add docs/data/uaf_providers_2025.json
          git commit -m "radar: ranking proveedores UAF 2025" || exit 0
          git pull --rebase origin main
          git push origin main
