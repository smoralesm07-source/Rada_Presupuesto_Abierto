name: Check RIGP Benefit Chain
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_benefit.js'
      - 'docs/assets/spend_safe_benefit.css'
      - 'docs/assets/spend_safe_societary.js'
      - 'docs/assets/spend_safe_societary.css'
      - 'docs/assets/spend_safe_benefit_temporal.js'
      - 'docs/assets/spend_safe_benefit_temporal.css'
      - 'docs/assets/spend_safe_benefit_convergence.js'
      - 'docs/assets/spend_safe_benefit_convergence.css'
      - 'docs/assets/spend_safe_decision.js'
      - 'docs/assets/spend_safe_decision.css'
      - 'docs/assets/spend_safe_value_trace.js'
      - 'docs/assets/spend_safe_value_trace.css'
      - 'docs/assets/spend_safe_actor_map.js'
      - 'docs/assets/spend_safe_actor_map.css'
      - 'docs/RIGP_BENEFIT_CHAIN_METHOD.md'
      - 'scripts/build_benefit_context_for_pages.py'
      - 'scripts/build_findings_for_pages.py'
      - 'scripts/build_explore_context_for_pages.py'
      - 'docs/data/entity_enrichment_v1.json'
      - 'schemas/007_benefit_chain.sql'
      - 'schemas/008_public_decision_links.sql'
      - '.github/workflows/check-benefit-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate syntax and safe runtime
        run: |
          node --check docs/assets/spend_safe_benefit.js
          node --check docs/assets/spend_safe_societary.js
          node --check docs/assets/spend_safe_benefit_temporal.js
          node --check docs/assets/spend_safe_benefit_convergence.js
          node --check docs/assets/spend_safe_decision.js
          node --check docs/assets/spend_safe_value_trace.js
          node --check docs/assets/spend_safe_actor_map.js
          python3 -m py_compile scripts/build_benefit_context_for_pages.py
          for f in docs/assets/spend_safe_benefit.js docs/assets/spend_safe_societary.js docs/assets/spend_safe_benefit_temporal.js docs/assets/spend_safe_benefit_convergence.js docs/assets/spend_safe_decision.js docs/assets/spend_safe_value_trace.js docs/assets/spend_safe_actor_map.js; do
            ! grep -q 'MutationObserver' "$f"
            ! grep -q 'setInterval' "$f"
            ! grep -q 'spend_years_v1.json' "$f"
          done
      - name: Validate benefit and actor traceability contract
        run: |
          grep -q 'data-benefit-view>Beneficiarios' docs/index.html
          grep -q 'assets/spend_safe_benefit.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_societary.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_benefit_temporal.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_benefit_convergence.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_decision.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_value_trace.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_actor_map.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_value_trace.css?v=1' docs/index.html
          grep -q 'assets/spend_safe_actor_map.css?v=1' docs/index.html
          grep -q 'Receptor económico directo' docs/assets/spend_safe_benefit.js
          grep -q 'Beneficio final' docs/assets/spend_safe_benefit.js
          grep -q 'No es probabilidad de delito' docs/assets/spend_safe_benefit.js
          grep -q 'Registro de Accionistas electrónico del RES no es de consulta pública' docs/assets/spend_safe_societary.js
          grep -q 'COINCIDENTE' docs/assets/spend_safe_benefit_temporal.js
          grep -q 'FUERA_DE_PERIODO' docs/assets/spend_safe_benefit_temporal.js
          grep -q 'temporallyRelevant' docs/assets/spend_safe_benefit_convergence.js
          grep -q 'Lado de la decisión pública' docs/assets/spend_safe_decision.js
          grep -q '¿Existe un vínculo documentado entre receptor y decisión pública?' docs/assets/spend_safe_decision.js
          grep -q '¿Quién terminó recibiendo, controlando o disponiendo del beneficio económico?' docs/assets/spend_safe_value_trace.js
          grep -q 'su licitud no se califica aquí' docs/assets/spend_safe_value_trace.js
          grep -q 'Personas y sociedades que requieren mayor profundización' docs/assets/spend_safe_actor_map.js
          grep -q 'no “beneficiario de un ilícito”' docs/assets/spend_safe_actor_map.js
          grep -q 'Disposición de valor documentada' docs/assets/spend_safe_actor_map.js
      - name: Build compact benefit payload
        run: |
          python3 scripts/build_findings_for_pages.py
          python3 scripts/build_explore_context_for_pages.py
          python3 scripts/build_benefit_context_for_pages.py
      - name: Validate payload, methodology and persistence model
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/benefit_context.json')
          assert p.exists(), 'benefit_context.json missing'
          d=json.loads(p.read_text())
          assert d.get('schema')=='RIGP-BENEFIT-CONTEXT-v1'
          assert d.get('methodology')=='RIGP-BENEFIT-CHAIN-v1'
          assert d.get('candidates'), 'benefit candidates empty'
          assert d.get('verification_chain') and len(d['verification_chain'])==4
          assert d.get('coverage',{}).get('ownership_control_sources_integrated')==0
          assert 'No es probabilidad de delito' in d.get('guardrail','')
          assert p.stat().st_size < 500_000, f'benefit payload too large: {p.stat().st_size}'
          for c in d['candidates'].values():
              assert c.get('stage')=='RECEPTOR_DIRECTO'
              assert c.get('ownership_control',{}).get('status')=='NO_INTEGRADO'
          print('[OK] benefit context', d.get('coverage'), round(p.stat().st_size/1024,1), 'KiB')
          PY
          grep -q 'Proveedor/receptor directo ≠ beneficiario final' docs/RIGP_BENEFIT_CHAIN_METHOD.md
          grep -q 'Hallazgo → Persona beneficiaria de delito' docs/RIGP_BENEFIT_CHAIN_METHOD.md
          grep -q 'benefit_confirmed_convergence' schemas/007_benefit_chain.sql
          grep -q 'temporal_relevance' schemas/007_benefit_chain.sql
          grep -q 'public_process_actors' schemas/008_public_decision_links.sql
          grep -q 'cross_side_relationships' schemas/008_public_decision_links.sql
          grep -q 'benefit_value_evidence' schemas/008_public_decision_links.sql
          grep -q 'documented_value_recipients' schemas/008_public_decision_links.sql
          grep -q 'EVIDENCIA_CONFIRMADA' schemas/008_public_decision_links.sql
