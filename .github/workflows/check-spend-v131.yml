name: Check RIGP findings UI
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/spend_safe_v3.js'
      - 'docs/assets/spend_safe_network.js'
      - 'docs/assets/spend_safe_guided_flow.js'
      - 'docs/assets/spend_safe_focus_summary.js'
      - 'docs/data/investigative_findings.json'
      - 'docs/data/investigation_queue.json'
      - 'scripts/build_findings_for_pages.py'
      - 'scripts/build_explore_context_for_pages.py'
      - '.github/workflows/check-spend-v131.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate current findings JavaScript
        run: |
          node --check docs/assets/spend_safe_v3.js
          node --check docs/assets/spend_safe_network.js
          node --check docs/assets/spend_safe_guided_flow.js
          node --check docs/assets/spend_safe_focus_summary.js
          grep -q 'investigative_findings.json' docs/assets/spend_safe_v3.js
          grep -q 'ATENCION_INMEDIATA' docs/assets/spend_safe_v3.js
          grep -q 'PROFUNDIZAR' docs/assets/spend_safe_v3.js
          grep -q 'ESCALADO' docs/assets/spend_safe_v3.js
          grep -q 'Red investigativa ligera' docs/assets/spend_safe_network.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_focus_summary.js
          ! grep -q 'setInterval' docs/assets/spend_safe_focus_summary.js
      - name: Validate current HTML
        run: |
          grep -q 'RIGP · ruta de investigación' docs/index.html
          grep -q 'Del hallazgo al eventual beneficiario, paso a paso' docs/index.html
          grep -q 'data-view="hallazgos"' docs/index.html
          grep -q 'data-view="explorar"' docs/index.html
          grep -q 'data-network-view' docs/index.html
          grep -q 'assets/spend_safe_v3.js?v=3' docs/index.html
          grep -q 'assets/spend_safe_network.js?v=1' docs/index.html
          grep -q 'assets/spend_safe_guided_flow.js?v=2' docs/index.html
          grep -q 'assets/spend_safe_focus_summary.js?v=1' docs/index.html
      - name: Build and validate compact payloads
        run: |
          python3 scripts/build_findings_for_pages.py
          python3 scripts/build_explore_context_for_pages.py
          node - <<'JS'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('docs/data/investigative_findings.json','utf8'));
          const e=JSON.parse(fs.readFileSync('docs/data/explore_context.json','utf8'));
          if(!String(f.methodology_version||'').startsWith('RIGP-FINDINGS')) throw new Error('unexpected findings methodology');
          if(!Array.isArray(f.relation_findings)||!f.guardrail) throw new Error('findings payload incomplete');
          if(e.schema!=='RIGP-EXPLORE-CONTEXT-v1') throw new Error('unexpected explore schema');
          if(!e.services||!e.providers||!e.relations) throw new Error('explore context incomplete');
          console.log('[OK] findings',f.relation_findings.length,'explore pairs',Object.keys(e.relations).length);
          JS
      - name: Validate network guardrail
        run: |
          grep -qi 'no acredita coordinación impropia' docs/assets/spend_safe_network.js
          grep -q 'MAX_NODES=12' docs/assets/spend_safe_network.js
          ! grep -q 'MutationObserver' docs/assets/spend_safe_network.js
          ! grep -q 'setInterval' docs/assets/spend_safe_network.js
