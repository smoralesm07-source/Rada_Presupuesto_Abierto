[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-presupuesto-abierto"
version = "0.1.0"
description = "Radar de búsqueda, anomalías y evidencia para Presupuesto Abierto Chile"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
