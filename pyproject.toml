[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-presupuesto-abierto"
version = "0.4.0"
description = "Radar de búsqueda, anomalías, evidencia y ejecución del gasto para Presupuesto Abierto Chile"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["presupuesto", "chile", "gasto-publico", "aml", "integridad", "open-data"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<22",
  "duckdb>=1.1,<2.0",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
radar-pa = "radar_presupuesto.cli:main"
radar-pa-pipeline = "radar_presupuesto.pipeline:main"
radar-pa-spend-view = "radar_presupuesto.spend_view:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
radar_presupuesto = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
